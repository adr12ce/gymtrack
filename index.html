/* =========================================================
   GymTrack · v5.8.0 · por adr12ce
   1. Estilos  2. Script: Config · Utils · Store/Migraciones · Consultas
   · Nube (Supabase) · Contador de días · UI · Gráficas · Vistas · Modales · Acceso · Acciones · App
   ========================================================= */
:root{
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --bg:#f7f8fc;--glow-1:#ffe0e6;--glow-2:#e3edff;
  --card:#ffffff;--card-2:#f2f4f9;--text:#141824;--muted:#6b7385;--line:#e4e7ef;
  --accent:#f0263f;--accent-2:#ff6a85;--accent-soft:#ffe4e9;--accent-text:#d1142d;
  --ok:#16a34a;--ok-soft:#dcfce7;--bad:#e11d48;--bad-soft:#ffe4e9;--danger:#e11d48;--star:#f5b301;--cardio:#0891b2;--cardio-soft:#dff4f9;--exc:#b45309;--exc-soft:#fef3c7;
  --shadow:0 1px 2px rgba(20,24,36,.04),0 6px 20px rgba(20,24,36,.06);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0d12;--glow-1:#3a0d17;--glow-2:#0d1a33;
    --card:#161922;--card-2:#1f2330;--text:#eef0f5;--muted:#9aa2b3;--line:#2a2f3d;
    --accent:#ff3b55;--accent-2:#ff7a92;--accent-soft:#3a1420;--accent-text:#ff6a80;
    --ok:#22c55e;--ok-soft:#10301d;--bad:#ff4d6d;--bad-soft:#3a1420;--danger:#ff4d6d;--cardio:#22d3ee;--cardio-soft:#0b2a33;--exc:#fbbf24;--exc-soft:#3a2a0a;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0d12;--glow-1:#3a0d17;--glow-2:#0d1a33;
  --card:#161922;--card-2:#1f2330;--text:#eef0f5;--muted:#9aa2b3;--line:#2a2f3d;
  --accent:#ff3b55;--accent-2:#ff7a92;--accent-soft:#3a1420;--accent-text:#ff6a80;
  --ok:#22c55e;--ok-soft:#10301d;--bad:#ff4d6d;--bad-soft:#3a1420;--danger:#ff4d6d;--cardio:#22d3ee;--cardio-soft:#0b2a33;--exc:#fbbf24;--exc-soft:#3a2a0a;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);min-height:100%;height:-webkit-fill-available}
body{margin:0;min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%;
  background:radial-gradient(900px 420px at -10% -8%,var(--glow-1),transparent 60%),radial-gradient(800px 420px at 110% -5%,var(--glow-2),transparent 60%),var(--bg);
  padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1.05}
.brand span{background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.byline{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}
main{max-width:720px;margin:0 auto;padding:4px 16px 24px;min-height:calc(100dvh - 160px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
main.wide{max-width:1280px}
h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:6px 0 12px}
h3{font-size:15px;font-weight:700;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:13px}.bold{font-weight:700}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.mt{margin-top:10px}.mt2{margin-top:16px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:700;padding:9px 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.add{width:100%;margin-top:8px;border-style:dashed;background:transparent;color:var(--muted);font-size:13px;padding:8px}
.icon-btn{border:none;background:transparent;color:var(--muted);font-size:16px;padding:6px 8px;cursor:pointer;border-radius:8px;line-height:1}
.icon-btn:active{background:var(--card-2)}
.icon-btn:disabled{opacity:.25;cursor:default}
.fav{font-size:17px}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:70px;resize:vertical}
label.field{display:block;font-size:13px;color:var(--muted);font-weight:600}
label.field>input,label.field>select{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent))}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;border:none;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;cursor:pointer;border-radius:12px;max-width:140px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent-text);background:var(--accent-soft)}
/* tablas de series (previsto / realizado) */
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:center;padding:4px}
.sets td{padding:3px 3px}
.sets td.n{width:34px;color:var(--muted);font-weight:700;text-align:center;font-size:14px;white-space:nowrap}
.sets td.x,.sets td.f{width:40px;text-align:center}
.sets td.r{position:relative}
.sets input,.sets select{padding:8px 4px;text-align:center;text-align-last:center;font-weight:600}
.sets input.fallo{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.sets input.fallo::placeholder{color:var(--bad);opacity:1;font-weight:800;letter-spacing:.04em}
.fallo-tag{position:absolute;top:-3px;right:7px;font-size:9px;font-weight:800;color:#fff;background:var(--bad);border-radius:4px;padding:1px 4px;letter-spacing:.04em;pointer-events:none}
.sets.cardio td.m{width:88px}
.sets select.int1{color:var(--ok)}.sets select.int2{color:#d97706}.sets select.int3{color:var(--bad)}
.ftog{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);color:var(--muted);font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.ftog.on{background:var(--bad);border-color:var(--bad);color:#fff}
.fcell{display:flex;gap:4px;justify-content:center}
.ftog.ds{font-size:12px;width:38px}
.ftog.ds.on{background:#9333ea;border-color:#9333ea}
.sets td.f{width:auto}
.sets input[readonly]{cursor:default}
.sets input.fallo[readonly]{font-size:13px;padding-left:2px;padding-right:2px}
.sets input.fallo[readonly]::placeholder{letter-spacing:0}
.sets input:disabled,.sets select:disabled,.ftog:disabled{opacity:1;cursor:default;-webkit-text-fill-color:currentColor;background:transparent;border-style:dashed}
.ftog:disabled:not(.on){opacity:.4}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.sec-title h3{margin:0;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.sec-plan h3{color:var(--muted)}.sec-done h3{color:var(--accent-text)}
.stars{display:inline-flex;flex:none}
.star{border:none;background:none;padding:2px;cursor:pointer;color:var(--line);font-size:18px;line-height:1}
.star.on{color:var(--star)}
.list-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.clickable{cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--card-2);border-radius:14px;padding:11px}
.stat b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:500}
.stat i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:3px}
/* semana en horizontal: cada día con su altura */
.week{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(172px,1fr);align-items:start;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:2px 16px 12px;scroll-padding:0 16px;scrollbar-width:thin}
.week::-webkit-scrollbar{height:8px}.week::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.week.dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}
.week.dragging *{pointer-events:none}
@media(min-width:1180px){.week{grid-auto-columns:1fr;overflow:visible;margin:0;padding:2px 0 12px}}
.col{scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.col.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 24px color-mix(in srgb,var(--accent) 18%,transparent)}
.col-head{padding:2px 2px 4px}
.col-head b{font-size:15px;font-weight:800}.col.today .col-head b{color:var(--accent-text)}
.col .rest{color:var(--muted);font-size:13px;padding:10px 2px 2px}
.grip{flex:none;align-self:stretch;display:grid;place-items:center;width:22px;margin:-9px 0 -9px -6px;color:var(--muted);font-size:16px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.item.lifted{position:relative;z-index:3;box-shadow:0 10px 28px rgba(0,0,0,.22);transform:scale(1.03);opacity:.96;transition:transform .08s}
body.sorting,body.sorting *{cursor:grabbing !important;user-select:none;-webkit-user-select:none}
.item{display:flex;align-items:center;gap:8px;padding:9px 9px;border-radius:12px;background:var(--card-2);margin-top:7px;border-left:4px solid var(--c);cursor:pointer}
.item .name{font-weight:700;font-size:14px;line-height:1.25}
.item .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.st{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;line-height:1}
.st.good{background:var(--ok-soft);color:var(--ok)}
.st.bad{background:var(--bad-soft);color:var(--bad)}
canvas.chart{width:100%;height:260px;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media(min-width:760px){.modal-bg{align-items:center}.sheet{border-radius:22px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sheet-head h3{font-size:20px;font-weight:800;margin:0}
@keyframes up{from{transform:translateY(30px);opacity:0}}@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:18px 8px;color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:var(--card-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--accent-text);box-shadow:var(--shadow)}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.up{color:var(--ok);font-weight:800}.down{color:var(--bad);font-weight:800}
.explain{font-size:14px;line-height:1.5;margin-bottom:6px}
.rm{width:100%;border-collapse:collapse;font-size:14px}
.rm th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.rm td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.rm tr:last-child td{border-bottom:none}
.rm td.w{font-weight:800}
.rm .r{text-align:right}
/* progreso */
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.big small{font-size:20px;color:var(--muted);font-weight:700;letter-spacing:-.01em}
.big.cardio{color:var(--cardio);font-size:36px}
.meter{height:10px;border-radius:6px;background:var(--card-2);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#4ade80,var(--ok))}
.weekdots{display:flex;gap:6px;margin-top:12px}
.weekdots span{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.weekdots span b{display:block;height:30px;border-radius:9px;background:var(--card-2);margin-bottom:4px}
.weekdots span.on b{background:linear-gradient(135deg,var(--accent-2),var(--accent))}
.weekdots span.today{color:var(--accent-text)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score div{border-radius:14px;padding:12px}
.score .g{background:var(--ok-soft);color:var(--ok)}.score .r{background:var(--bad-soft);color:var(--bad)}
.score b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em}
.score span{font-size:12px;font-weight:700}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;background:var(--card-2)}
.split i{display:block;height:100%}
.tpl-day{border-top:1px solid var(--line);padding:10px 0}
.tpl-day:first-of-type{border-top:none}
/* estados de cada día para el contador */
.weekdots span b{display:grid;place-items:center;font-size:14px;font-weight:800}
.weekdots span.gym b{background:linear-gradient(135deg,#4ade80,var(--ok));color:#fff}
.weekdots span.rest b{background:var(--card-2);color:var(--muted)}
.weekdots span.miss b{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.weekdots span.excused b{background:var(--exc-soft);color:var(--exc)}
.weekdots span.today b{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.weekdots span.future b,.weekdots span.before b{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
/* calendario de días en el gym */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head b{font-size:18px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding-bottom:2px}
.cal-day{aspect-ratio:1;border:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:inherit;font-size:15px;font-weight:700;background:transparent;color:var(--text);cursor:pointer;padding:0;box-shadow:inset 0 0 0 1.5px var(--line)}
.cal-day i{font-style:normal;font-size:10px;font-weight:800;line-height:1}
.cal-day.gym{background:linear-gradient(135deg,#4ade80,var(--ok));color:#fff;box-shadow:none}
.cal-day.rest{background:var(--card-2);color:var(--muted);box-shadow:none}
.cal-day.miss{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.cal-day.excused{background:var(--exc-soft);color:var(--exc);box-shadow:none}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-text)}
.cal-day.gym.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day.before{opacity:.45}
.cal-day.out{visibility:hidden}
.cal-sum{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dstate{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.dstate.miss{background:var(--bad-soft);color:var(--bad)}
.dstate.excused{background:var(--exc-soft);color:var(--exc)}
.dstate.rst{background:var(--card-2);color:var(--muted)}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.excuse{margin-top:6px;width:100%;font-size:12px;padding:6px 8px}
.goal-seg button{min-width:36px;padding:6px 0}
/* acceso: login / registro */
body.auth .tabbar{display:none}
body.auth{padding-bottom:24px}
.auth-wrap{max-width:420px;margin:12px auto 0}
.auth-hero{text-align:center;margin:10px 0 18px}
.auth-hero .brand{font-size:36px}
.auth-hero p{color:var(--muted);margin:6px 0 0;font-size:14px}
.auth-tabs{display:flex;background:var(--card-2);border-radius:12px;padding:3px;margin-bottom:14px}
.auth-tabs button{flex:1;border:none;background:none;font:inherit;font-weight:700;font-size:14px;padding:9px;border-radius:10px;color:var(--muted);cursor:pointer}
.auth-tabs button.on{background:var(--card);color:var(--accent-text);box-shadow:var(--shadow)}
.form-err,.form-ok{font-size:13px;font-weight:600;border-radius:10px;padding:9px 11px;margin-top:12px}
.form-err{background:var(--bad-soft);color:var(--bad)}
.form-ok{background:var(--ok-soft);color:var(--ok)}
.linkbtn{border:none;background:none;color:var(--accent-text);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px}
.btn:disabled{opacity:.6;cursor:default}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--ok)}
.sync.saving{background:#f59e0b;animation:pulse 1s infinite}
.sync.offline{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.setup ol{padding-left:20px;line-height:1.6;font-size:14px}
.setup code{background:var(--card-2);padding:1px 5px;border-radius:5px;font-size:13px}
/* perfil, colores y tamaño */
#top-sub{display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--accent-2),var(--accent));border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;overflow:hidden;padding:0}

.avatar.lg{width:64px;height:64px;font-size:26px;cursor:default}
.profile-head{display:flex;align-items:center;gap:14px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.swatch.on{box-shadow:0 0 0 2px var(--text)}
.scale-row{display:flex;align-items:center;gap:10px}
.scale-row b{min-width:56px;text-align:center;font-size:16px}
.ask-text{font-size:15px;line-height:1.5;margin:0 0 16px}
.subsec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.subsec h4{margin:0 0 10px;font-size:14px;font-weight:700}
#exf-load{flex-wrap:wrap}
.crop-box{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:4px auto 0;border-radius:18px;overflow:hidden;background:#000;touch-action:none;cursor:grab;user-select:none}
.crop-box:active{cursor:grabbing}
.crop-box canvas{width:100%;height:100%;display:block}
.crop-box .mask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.5);pointer-events:none;outline:2px solid rgba(255,255,255,.8);outline-offset:-2px}
.crop-zoom{display:flex;align-items:center;gap:10px;margin-top:14px}
.crop-zoom input{flex:1;padding:0;accent-color:var(--accent)}
/* biseries */
.ss-group{display:flex;align-items:stretch;gap:2px;margin-top:7px;padding:6px 6px 6px 4px;border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.ss-group > .grip{margin:0;width:20px}
.ss-body{flex:1;min-width:0}
.ss-group .item{margin-top:5px}
.ss-label{font-size:11px;font-weight:800;color:var(--accent-text);text-transform:uppercase;letter-spacing:.05em;padding:0 2px}
.ss-group.lifted{position:relative;z-index:3;box-shadow:0 10px 28px rgba(0,0,0,.22);transform:scale(1.03);background:var(--card)}
.ssk{font-style:normal;display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:5px;font-size:11px;font-weight:800;color:#fff;margin-left:3px;vertical-align:1px}
.ssk.a{background:var(--accent)}.ssk.b{background:#6366f1}
.ss-who{display:flex;align-items:center;gap:8px;padding:4px 0}
.ss-who .ssk{margin:0}
.ss-who b{flex:1;min-width:0}
.ssk.c{background:#f59e0b}
.sets.ss{border-collapse:separate;border-spacing:0}
.sets.ss tbody.ssg td{padding-top:3px;padding-bottom:3px}
.sets.ss tbody.ssg:nth-of-type(odd) td{background:color-mix(in srgb,var(--card-2) 70%,transparent)}
.sets.ss tbody.ssg tr:first-child td{border-top:2px solid var(--line);padding-top:7px}
.sets.ss tbody.ssg tr:last-child td{padding-bottom:7px}
.sets.ss td.ssn{font-size:20px;font-weight:800;color:var(--text);vertical-align:middle;border-left:4px solid var(--accent);width:34px}
.sets.ss td.k{width:26px;text-align:center;padding-left:0;padding-right:0}
.sets.ss td.k .ssk{margin:0}
.ss-whos .ss-who{border-radius:10px;padding:6px 2px}
.ss-whos .ss-who + .ss-who{border-top:1px solid var(--line)}
.ss-who .grip{margin:0 -2px 0 0}
.ss-who .icon-btn{width:30px;height:30px;font-size:13px}
.ss-who.lifted{background:var(--card);box-shadow:0 10px 28px rgba(0,0,0,.22);position:relative;z-index:3}
.ss-group .ss-body .item .grip{width:16px}
.del-account{margin-left:auto;background:var(--danger);border-color:var(--danger);color:var(--text)}
.reset-row{margin-top:10px}
.sets td.na{text-align:center;color:var(--muted)}
/* nota del día */
.note-add{margin-top:6px}
.note-chip{display:block;width:100%;text-align:left;margin-top:8px;border:none;border-radius:12px;padding:8px 10px;background:var(--accent-soft);color:var(--text);font:inherit;font-size:12.5px;cursor:pointer;line-height:1.35}
.note-chip b{display:block;font-size:12px;color:var(--accent-text)}
.note-chip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.note-chip .nstars{display:inline;color:var(--star)}
.note-stars .star{font-size:32px;padding:2px 4px}
.update-bar{position:fixed;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;margin:0 auto;width:fit-content;z-index:40;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px;max-width:calc(100vw - 24px);animation:up .2s ease-out}
.update-bar span{white-space:nowrap}
.users-count{text-align:center;font-size:12.5px;color:var(--muted);margin-top:4px}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
'use strict';
/* ===================== 1. CONFIG ===================== */
const APP_VERSION = '5.8.0';
const SCHEMA_VERSION = 8;          // súbelo cuando cambie la estructura de datos y añade su migración
const STORAGE_KEY = 'gymtrack.data';
const PENDING_KEY = 'gymtrack.pending.';   // + id de usuario: hay cambios guardados en el dispositivo sin subir a la nube
const PROFILE_KEY = 'gymtrack.profile.';   // + id de usuario: copia del perfil para abrir sin conexión   // caché local (una por usuario) y datos antiguos sin cuenta
/* ---- Servidor (Supabase): Project Settings → API ----
   La clave "anon public" puede ir en la web: la seguridad la ponen las reglas RLS de supabase.sql */
const SUPABASE_URL = 'https://nopkvdccoavekyyfgiaz.supabase.co';        // ej. 'https://abcdefgh.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_U8o9eZk3XVOJu4tdZP78HQ_2cE3fss2';   // ej. 'eyJhbGciOiJI...'
const EMAIL_ENABLED = true;     // requiere un correo propio (SMTP) configurado en Supabase: verificación y recuperación de contraseña
const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DAYS_S = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS_S = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DEFAULT_GOAL = 5;            // días de gym por semana si aún no se ha elegido (el login lo preguntará)
// Grupos musculares: cada grupo tiene su color y sus músculos. Edita aquí para cambiarlos.
// El grupo con cardio:true usa minutos e intensidad en lugar de kg y reps.
const GROUPS = [
// "General" sirve para cuando no sabes el músculo exacto pero sí el grupo.
  { id: 'espalda', name: 'Espalda', color: '#2563eb', muscles: ['General','Dorsal','Trapecio','Espalda alta','Lumbar'] },
  { id: 'pecho',   name: 'Pecho',   color: '#dc2626', muscles: ['General','Pecho superior','Pecho medio','Pecho inferior'] },
  { id: 'hombros', name: 'Hombros', color: '#db2777', muscles: ['General','Frontal','Posterior','Deltoides'] },
  { id: 'triceps', name: 'Tríceps', color: '#9333ea', muscles: ['General','Cabeza larga','Cabeza lateral','Cabeza medial'] },
  { id: 'brazo',   name: 'Bíceps',  color: '#d97706', muscles: ['General','Bíceps','Braquial','Antebrazo'] },
  { id: 'piernas', name: 'Piernas', color: '#16a34a', muscles: ['General','Cuádriceps','Isquiotibiales','Glúteos','Gemelos','Aductores','Abductores'] },
  { id: 'abdominales', name: 'Abdominales', color: '#a0522d', muscles: ['General','Abdominal superior','Abdominal inferior','Oblicuos','Transverso'] },
  { id: 'cardio',  name: 'Cardio',  color: '#0891b2', muscles: ['Cinta','Bicicleta','Elíptica','Remo','Escaladora','Comba','Otro'], cardio: true }
];
// Tipos de carga de un ejercicio de fuerza
const LOADS = {
  kg:     { name: 'Kg',       col: 'Kg' },
  side:   { name: 'Por lado', col: 'Kg/lado' },
  plates: { name: 'Placas',   col: 'Placa' },
  bw:     { name: 'Peso corporal', col: '' },   // solo repeticiones
  cardio: { name: 'Minutos e intensidad', col: 'Min' }
};
const INTENSITY = ['Baja','Moderada','Alta'];   // se guarda como 1, 2, 3
const MAX_PLATES = 50;
// Límites (evitan abusos y que una cuenta llene la base de datos)
const LIMITS = { exercises: 300, perDay: 30, sets: 30, templates: 30 };
// Colores de acento (sustituyen al rojo). l = modo claro, d = modo oscuro: [principal, degradado, fondo suave, texto]
const ACCENTS = [
  { id: 'rojo',     name: 'Rojo',     l: ['#f0263f', '#ff6a85', '#ffe4e9', '#d1142d'], d: ['#ff3b55', '#ff7a92', '#3a1420', '#ff6a80'] },
  { id: 'naranja',  name: 'Naranja',  l: ['#ea580c', '#fb923c', '#ffedd5', '#c2410c'], d: ['#f97316', '#fdba74', '#3a1d0a', '#fb923c'] },
  { id: 'ambar',    name: 'Ámbar',    l: ['#d97706', '#fbbf24', '#fef3c7', '#b45309'], d: ['#f59e0b', '#fcd34d', '#352409', '#fbbf24'] },
  { id: 'verde',    name: 'Verde',    l: ['#059669', '#34d399', '#d1fae5', '#047857'], d: ['#10b981', '#6ee7b7', '#0b2e22', '#34d399'] },
  { id: 'turquesa', name: 'Turquesa', l: ['#0891b2', '#22d3ee', '#cffafe', '#0e7490'], d: ['#06b6d4', '#67e8f9', '#082f3a', '#22d3ee'] },
  { id: 'azul',     name: 'Azul',     l: ['#2563eb', '#60a5fa', '#dbeafe', '#1d4ed8'], d: ['#3b82f6', '#93c5fd', '#14213f', '#60a5fa'] },
  { id: 'morado',   name: 'Morado',   l: ['#7c3aed', '#a78bfa', '#ede9fe', '#6d28d9'], d: ['#8b5cf6', '#c4b5fd', '#25173f', '#a78bfa'] },
  { id: 'rosa',     name: 'Rosa',     l: ['#db2777', '#f472b6', '#fce7f3', '#be185d'], d: ['#ec4899', '#f9a8d4', '#3b0f25', '#f472b6'] }
];
const SCALES = [0.8, 0.9, 1, 1.1, 1.2, 1.3];   // tamaño de toda la vista (se guarda por dispositivo)
const SCALE_KEY = 'gymtrack.scale';
const WEEKS_SHOWN = 12;

/* ===================== 2. UTILS ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const U = {
  uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
  slug: s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
  iso: d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'),
  parse: s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
  today: () => U.iso(new Date()),
  addDays: (s, n) => { const d = U.parse(s); d.setDate(d.getDate() + n); return U.iso(d); },
  dow: s => (U.parse(s).getDay() + 6) % 7,               // 0 = lunes
  monday: s => U.addDays(s, -U.dow(s)),
  fmt: s => { const d = U.parse(s); return d.getDate() + ' ' + MONTHS_S[d.getMonth()]; },
  fmtY: s => { const d = U.parse(s); return d.getDate() + ' ' + MONTHS_S[d.getMonth()] + ' ' + d.getFullYear(); },
  fmtLong: s => { const d = U.parse(s); return DAYS[U.dow(s)] + ', ' + d.getDate() + ' ' + MONTHS_S[d.getMonth()]; },
  short: s => { const d = U.parse(s); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); },
  range: m => { const e = U.addDays(m, 6), a = U.parse(m), b = U.parse(e); return `${U.fmt(m)} – ${U.fmt(e)}${a.getFullYear() !== new Date().getFullYear() || b.getFullYear() !== new Date().getFullYear() ? ' ' + b.getFullYear() : ''}`; },
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  num: v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : null; },
  kg: n => (n ?? 0).toLocaleString('es-ES', { maximumFractionDigits: 2 }),
  int: n => Math.round(n ?? 0).toLocaleString('es-ES'),
  pct: n => (n >= 0 ? '+' : '−') + Math.abs(n).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' %',
  compact: n => Math.abs(n) >= 1000 ? (n / 1000).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + 'k' : (Math.round(n * 10) / 10).toLocaleString('es-ES'),
  epley: (w, r) => r <= 1 ? w : w * (1 + r / 30),        // 1RM estimado
  avg: a => a.reduce((s, x) => s + x, 0) / a.length,
  row: (s = {}) => ({ w: s.w ?? null, r: s.r ?? null, f: !!s.f, ds: !!(s.f && s.ds) }),   // serie de fuerza (f = al fallo, ds = drop set)
  crow: (s = {}) => ({ m: s.m ?? null, i: s.i ?? null }),            // bloque de cardio: minutos + intensidad (1-3)
  // duración: 45 min · 2 h 10 min · 1 d 3 h 5 min (sin días ni horas si no llegan)
  dur: min => { min = Math.round(min || 0); const d = Math.floor(min / 1440), h = Math.floor(min % 1440 / 60), m = min % 60, p = []; if (d) p.push(d + ' d'); if (h) p.push(h + ' h'); if (m || !p.length) p.push(m + ' min'); return p.join(' '); },
  // solo números: decimales (coma o punto) para la carga, enteros para reps y minutos
  cleanDec: v => { let s = v.replace(/[^0-9.,]/g, ''); const i = s.search(/[.,]/); if (i >= 0) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/[.,]/g, ''); return s; },
  cleanInt: v => v.replace(/\D/g, '')
};

/* ===================== 3. STORE + MIGRACIONES ===================== */
function defaultData() {
  return {
    version: SCHEMA_VERSION,
    // cuenta: fecha de alta y días de gym por semana (con historial: cada cambio vale desde su semana).
    // Cuando haya login, estos datos vendrán del registro del usuario.
    account: { createdAt: U.today(), goals: [{ from: U.monday(U.today()), n: DEFAULT_GOAL }] },
    settings: { theme: 'auto' },
    excused: {},    // faltas justificadas: { 'AAAA-MM-DD': true }
    exercises: [],  // { id, name, group, muscle, load:'kg'|'side'|'plates'|'cardio', rating, pinned(=favorito), notes }
    days: {},       // 'AAAA-MM-DD': [ { id, exerciseId, plan:[fila], log:[fila], ss? } ]   fila = {w,r,f,ds} o, en cardio, {m,i} · ss = id de biserie (2 ejercicios seguidos)
    templates: [],  // rutinas prefabricadas: { id, name, days:[ [ {id, exerciseId, plan, ss?} ] × 7 ] }
    notes: {},      // nota de cada día: { 'AAAA-MM-DD': { r: valoración 1-5 o null, t: observaciones } }
    meta: {}        // marca de tiempo de cada parte (para fusionar cambios de varios dispositivos), ver Sync
  };
}
const Migrations = {
  // v1 → v2: sin rutinas ni ejercicios por defecto; los entrenos pasan a días
  1: d => {
    const map = { Pecho: ['pecho','Pecho medio'], Espalda: ['espalda','Dorsal'], Hombros: ['brazo','Hombro'], 'Bíceps': ['brazo','Bíceps'],
      'Tríceps': ['triceps','Cabeza larga'], 'Cuádriceps': ['piernas','Cuádriceps'], Isquiotibiales: ['piernas','Isquiotibiales'],
      'Glúteos': ['piernas','Glúteos'], Gemelos: ['piernas','Gemelos'], Antebrazo: ['brazo','Antebrazo'] };
    const exercises = (d.exercises || []).filter(e => e.custom).map(e => {
      const [group, muscle] = map[e.muscle] || ['brazo','Bíceps'];
      return { id: e.id, name: e.name, group, muscle, rating: e.rating || 0, pinned: false, notes: e.notes || '' };
    });
    const keep = new Set(exercises.map(e => e.id)), days = {};
    for (const w of d.workouts || []) for (const en of w.entries || []) if (keep.has(en.exerciseId))
      (days[w.date] ||= []).push({ id: U.uid(), exerciseId: en.exerciseId, sets: en.sets.length || 3, reps: '', log: en.sets });
    return { version: 2, settings: d.settings || { theme: 'auto' }, exercises, days };
  },
  // v2 → v3: lo previsto pasa a ser por series, tipo de carga y "al fallo"
  2: d => {
    for (const e of d.exercises || []) e.load ||= 'kg';
    for (const date of Object.keys(d.days || {})) d.days[date] = d.days[date].map(it => {
      const r = parseInt(it.reps) || null, n = Math.max(1, it.sets || 1);
      const log = (it.log || []).map(U.row);
      return { id: it.id, exerciseId: it.exerciseId, plan: Array.from({ length: n }, () => U.row({ r })), log: log.length ? log : [U.row()] };
    });
    d.version = 3; return d;
  },
  // v3 → v4: rutinas prefabricadas
  3: d => { d.templates ||= []; d.version = 4; return d; },
  // v4 → v5: fecha de alta (contador de días) y cardio. Mientras no haya login, el alta es el primer día con datos.
  4: d => { const first = Object.keys(d.days || {}).sort()[0]; d.account = { createdAt: first && first < U.today() ? first : U.today() }; d.version = 5; return d; },
  // v5 → v6: días de gym por semana con historial y faltas justificadas
  5: d => { d.account ||= { createdAt: U.today() }; d.account.goals ||= [{ from: U.monday(d.account.createdAt), n: DEFAULT_GOAL }]; d.excused ||= {}; d.version = 6; return d; },
  // v6 → v7: los ejercicios de "Hombro" (antes dentro de Bíceps) pasan al grupo nuevo Hombros
  6: d => { for (const e of d.exercises || []) if (e.group === 'brazo' && e.muscle === 'Hombro') { e.group = 'hombros'; e.muscle = 'General'; } d.version = 7; return d; },
  // v7 → v8: notas del día, biseries y marcas de tiempo para la sincronización
  7: d => { d.notes ||= {}; d.meta ||= {}; d.version = 8; return d; },
  run(d) {
    let v = d.version || 1;
    while (v < SCHEMA_VERSION) { if (this[v]) d = this[v](d); v++; }
    const def = defaultData();
    for (const k of Object.keys(def)) if (d[k] == null) d[k] = def[k];
    d.settings = { ...def.settings, ...d.settings };
    d.version = SCHEMA_VERSION;
    return d;
  }
};
/* ===================== SINCRONIZACIÓN POR PARTES =====================
   Los datos se dividen en partes: ajustes, cuenta, cada ejercicio, cada día, cada rutina prefabricada,
   cada falta justificada y cada nota. Cada vez que cambia una parte se apunta la hora en data.meta
   (también cuando se borra). Al juntar dos versiones (este dispositivo y la nube) gana, parte a parte,
   la modificada más tarde: así editar en dos dispositivos a la vez ya no hace perder cambios.          */
const Sync = {
  snap: {},   // cómo estaba cada parte la última vez que se guardó (para saber qué ha cambiado)
  parts(d) {
    const p = { settings: d.settings, account: d.account };
    for (const e of d.exercises || []) p['ex:' + e.id] = e;
    for (const [k, v] of Object.entries(d.days || {})) p['day:' + k] = v;
    for (const t of d.templates || []) p['tpl:' + t.id] = t;
    for (const k of Object.keys(d.excused || {})) p['exc:' + k] = true;
    for (const [k, v] of Object.entries(d.notes || {})) p['note:' + k] = v;
    return p;
  },
  build(p, meta, base) {
    const d = { version: SCHEMA_VERSION, settings: p.settings || base.settings, account: p.account || base.account, exercises: [], days: {}, templates: [], excused: {}, notes: {}, meta };
    for (const [k, v] of Object.entries(p)) {
      const i = k.indexOf(':'); if (i < 0) continue;
      const type = k.slice(0, i), id = k.slice(i + 1);
      if (type === 'ex') d.exercises.push(v); else if (type === 'day') d.days[id] = v; else if (type === 'tpl') d.templates.push(v);
      else if (type === 'exc') d.excused[id] = true; else if (type === 'note') d.notes[id] = v;
    }
    d.templates.sort((a, b) => a.id.localeCompare(b.id));   // los ids empiezan por la fecha de creación: mantiene el orden
    return d;
  },
  reset(d) { const p = this.parts(d); this.snap = {}; for (const k in p) this.snap[k] = JSON.stringify(p[k]); },
  // apunta la hora en las partes que han cambiado (o se han borrado) desde el último guardado
  stamp(d) {
    const p = this.parts(d), now = Date.now(), snap = {}; d.meta ||= {};
    for (const k in p) { const v = JSON.stringify(p[k]); snap[k] = v; if (this.snap[k] !== v) d.meta[k] = now; }
    for (const k in this.snap) if (!(k in p)) d.meta[k] = now;
    this.snap = snap;
  },
  // junta la versión local (L) con la de la nube (R). changed = la nube aporta algo distinto a lo local
  merge(L, R) {
    const pl = this.parts(L), pr = this.parts(R), ml = L.meta || {}, mr = R.meta || {}, out = {}, meta = {};
    let changed = false;
    for (const k of new Set([...Object.keys(pl), ...Object.keys(pr), ...Object.keys(ml), ...Object.keys(mr)])) {
      const tl = ml[k] || 0, tr = mr[k] || 0, useL = tl >= tr, win = useL ? pl : pr, lose = useL ? pr : pl, tw = useL ? tl : tr;
      let v;
      if (k in win) v = win[k]; else if (!tw && k in lose) v = lose[k];   // sin marca de tiempo (datos antiguos): se conserva
      if (v !== undefined) out[k] = v;
      if (tl || tr) meta[k] = Math.max(tl, tr);
      if ((k in pl ? JSON.stringify(pl[k]) : undefined) !== (v === undefined ? undefined : JSON.stringify(v))) changed = true;
    }
    return { data: this.build(out, meta, L), changed };
  }
};

/* Datos del usuario con sesión iniciada: copia local (para ir rápido y sin conexión) + nube */
const Store = {
  data: null, key: STORAGE_KEY,
  use(uid) { this.key = STORAGE_KEY + '.' + uid; },
  cached() { try { const raw = localStorage.getItem(this.key); return raw ? JSON.parse(raw) : null; } catch { return null; } },
  set(d) { this.data = d; Sync.reset(d); },
  save(sync = true) {
    if (!this.data) return;
    if (sync) Sync.stamp(this.data);
    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { UI.toast('⚠️ No se pudo guardar en este navegador'); }
    if (sync) Cloud.queue();
  }
};

/* ===================== NUBE (Supabase) =====================
   Cada usuario tiene un documento con todos sus datos en la tabla user_data.
   Los cambios se suben agrupados (0,7 s). Antes de subir se lee la versión de la nube y, si otro
   dispositivo guardó algo, se fusiona (ver Sync). La escritura es condicional: solo se guarda si nadie
   ha escrito entre medias; si no, se vuelve a leer y fusionar. Sin conexión, los cambios quedan
   marcados como pendientes en el dispositivo (sobreviven a cerrar la app) y se suben al volver.      */
const Cloud = {
  sb: null, user: null, profile: null, timer: null, dirty: false, saving: false, lastRemote: null, status: 'saved',
  configured() { return !!(SUPABASE_URL && SUPABASE_ANON_KEY); },
  init() {
    if (!window.supabase) throw new Error('nolib');
    this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  },
  setStatus(s) {
    this.status = s; const el = $('#sync');
    if (el) { el.className = 'sync ' + s; el.title = { saved: 'Guardado en la nube', saving: 'Guardando…', offline: 'Sin conexión: se guardará al volver' }[s]; }
  },
  pending(on) {   // marca persistente de "hay cambios sin subir" (sobrevive a cerrar la app)
    if (!this.user) return false;
    const k = PENDING_KEY + this.user.id;
    try { if (on === true) localStorage.setItem(k, '1'); else if (on === false) localStorage.removeItem(k); else return localStorage.getItem(k) === '1'; } catch { return false; }
  },
  queue() { if (!this.user) return; this.dirty = true; this.pending(true); this.setStatus('saving'); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 700); },
  // incorpora una versión de la nube a lo local (fusionando) y refresca la pantalla si cambia algo
  absorb(r) {
    const { data, changed } = Sync.merge(Store.data, Migrations.run(r.data));
    Store.set(data); this.lastRemote = r.updated_at; Store.save(false);
    if (changed) { App.applyTheme(); if (UI.stack.length) redrawModals(); else App.render(); }
  },
  async flush() {
    if (!this.user || !this.dirty || this.saving) return;
    this.saving = true; this.dirty = false; clearTimeout(this.timer);
    const uid = this.user.id;
    let ok = false, err = null;
    try {
      for (let i = 0; i < 4 && !ok; i++) {
        const { data: r, error } = await this.sb.from('user_data').select('data, updated_at').eq('user_id', uid).maybeSingle();
        if (error) throw error;
        if (!this.user || this.user.id !== uid) return;
        if (r && r.updated_at !== this.lastRemote) this.absorb(r);   // otro dispositivo guardó algo: se fusiona antes de subir
        const payload = { data: Store.data, updated_at: new Date().toISOString() };
        const q = r ? this.sb.from('user_data').update(payload).eq('user_id', uid).eq('updated_at', r.updated_at)   // solo si nadie escribió entre medias
                    : this.sb.from('user_data').insert({ user_id: uid, ...payload });
        const { data: rows, error: e2 } = await q.select('updated_at');
        if (e2) { if (!r && /duplicate|23505/.test((e2.message || '') + (e2.code || ''))) continue; throw e2; }
        if (rows && rows.length) { this.lastRemote = rows[0].updated_at; ok = true; }
      }
      if (!ok) throw new Error('conflict');
    } catch (e) { err = e; } finally { this.saving = false; }
    if (!this.user || this.user.id !== uid) return;
    if (err) {
      this.dirty = true; this.setStatus('offline'); clearTimeout(this.timer);
      if (/data_size/.test(err.message || '')) { UI.toast('⚠️ Has llegado al límite de datos de tu cuenta'); return; }
      this.timer = setTimeout(() => this.flush(), 5000); return;
    }
    if (this.dirty) this.flush(); else { this.pending(false); this.setStatus('saved'); }
  },
  async fetchData() {
    const { data, error } = await this.sb.from('user_data').select('data, updated_at').eq('user_id', this.user.id).maybeSingle();
    if (error) throw error; return data;
  },
  async fetchProfile() {
    const { data, error } = await this.sb.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
    if (error) throw error;
    try { if (data) localStorage.setItem(PROFILE_KEY + this.user.id, JSON.stringify(data)); } catch {}
    return data;
  },
  cachedProfile() { try { return JSON.parse(localStorage.getItem(PROFILE_KEY + this.user.id)); } catch { return null; } },
  async updateProfile(fields) {
    const { error } = await this.sb.from('profiles').update(fields).eq('id', this.user.id);
    if (error) throw error;
    Object.assign(this.profile, fields);
    try { localStorage.setItem(PROFILE_KEY + this.user.id, JSON.stringify(this.profile)); } catch {}
  },
  async userCount() {
    const { data, error } = await this.sb.rpc('user_count'); if (error) throw error; return data;
  },
  // al volver a la app (y cada minuto): se suben los pendientes y se traen los cambios de otros dispositivos
  async refresh() {
    if (!this.user || this.saving) return;
    if (this.dirty) return this.flush();
    try {
      const r = await this.fetchData();
      if (r && r.updated_at !== this.lastRemote && !this.saving && !this.dirty) this.absorb(r);
      if (!this.dirty) this.setStatus('saved');
    } catch { this.setStatus(this.dirty ? 'offline' : this.status); }
  }
};

/* ===================== 4. CONSULTAS ===================== */
const DB = {
  get d() { return Store.data; },
  ex(id) { return this.d.exercises.find(e => e.id === id); },
  exName(id) { return this.ex(id)?.name || '(ejercicio eliminado)'; },
  group(id) { return GROUPS.find(g => g.id === id) || GROUPS[0]; },
  color(exId) { return this.group(this.ex(exId)?.group).color; },
  isCardio(ex) { return ex?.load === 'cardio'; },
  day(date) { return this.d.days[date] || []; },
  tpl(id) { return this.d.templates.find(t => t.id === id); },
  done: s => !!s && (s.r > 0 || !!s.f || s.m > 0),             // serie/bloque realizado
  validSets(sets) { return (sets || []).filter(this.done); },
  isBW(ex) { return ex?.load === 'bw'; },
  blank(ex) { return this.isCardio(ex) ? U.crow() : U.row(); },
  copyRow(ex, s) { return this.isCardio(ex) ? U.crow(s) : U.row(s); },
  newPlan(ex) { return this.isCardio(ex) ? [U.crow({ m: 30, i: 2 })] : Array.from({ length: 3 }, () => U.row({ r: 10 })); },
  // carga mostrada según el tipo: 80 kg · 15 - 15 · 12 pl
  load(ex, w) {
    const t = ex?.load || 'kg';
    if (t === 'bw') return 'Corporal';
    if (w == null) return '–';
    return t === 'side' ? `${U.kg(w)} - ${U.kg(w)}` : t === 'plates' ? `${w} pl` : `${U.kg(w)} kg`;
  },
  reps: s => { const f = s.f ? (s.ds ? 'fallo + DS' : 'fallo') : ''; return s.r != null ? (f ? `${s.r} (${f})` : `${s.r}`) : (f ? f.toUpperCase() : '?'); },
  planReps: s => s.f ? (s.ds ? 'FALLO + DS' : 'FALLO') : (s.r ?? '?'),   // en lo previsto el fallo no lleva número
  setText(ex, s) { if (this.isBW(ex) && s.ds) s = { ...s, ds: false }; return this.isCardio(ex) ? `${s.m ?? '?'} min${s.i ? ' ' + INTENSITY[s.i - 1].toLowerCase() : ''}` : this.isBW(ex) ? `${this.reps(s)} reps` : `${this.load(ex, s.w || 0)} × ${this.reps(s)}`; },
  stats(sets, ex) {
    const v = this.validSets(sets); if (!v.length) return null;
    if (this.isCardio(ex)) {
      const mins = v.reduce((s, x) => s + (x.m || 0), 0), byInt = [0, 0, 0];
      v.forEach(x => { if (x.i) byInt[x.i - 1] += x.m || 0; });
      return { cardio: true, mins, byInt, maxM: mins, n: v.length, maxW: 0, best: 0, vol: 0, maxR: 0, reps: 0, top: null };
    }
    const t = ex?.load || 'kg', mult = t === 'side' ? 2 : 1, bw = t === 'bw';
    let maxW = 0, best = 0, vol = 0, maxR = 0, top = null, reps = 0;
    for (const s of v) {
      const w = bw ? 0 : s.w || 0, r = s.r || 0, e1 = bw ? r : U.epley(w, r || 1);   // peso corporal: manda el nº de reps
      maxW = Math.max(maxW, w); maxR = Math.max(maxR, r); reps += r;
      if (!top || e1 > best) { best = e1; top = s; }
      if (t !== 'plates' && !bw) vol += w * mult * r;   // placas y peso corporal no son kg: no cuentan para el volumen
    }
    return { maxW, best, vol, maxR, top, n: v.length, reps };
  },
  history(exId) {      // sesiones con series realizadas, de más antigua a más reciente
    const out = [], ex = this.ex(exId);
    for (const date of Object.keys(this.d.days).sort()) for (const it of this.d.days[date]) if (it.exerciseId === exId) {
      const st = this.stats(it.log, ex); if (st) out.push({ date, sets: this.validSets(it.log), ...st });
    }
    return out;
  },
  last(exId, before) { const h = this.history(exId).filter(x => x.date < before); return h[h.length - 1] || null; },
  records(exId) {
    const h = this.history(exId); if (!h.length) return null;
    if (h[0].cardio) {
      const longest = h.reduce((a, x) => x.mins > a.mins ? x : a), byInt = [0, 0, 0];
      h.forEach(x => x.byInt.forEach((m, i) => { byInt[i] += m; }));
      return { cardio: true, mins: h.reduce((s, x) => s + x.mins, 0), longest: longest.mins, longestDate: longest.date, byInt, sessions: h.length, last: h[h.length - 1].date };
    }
    let maxW = -1, maxWDate = null, best = -1, top = null, bestDate = null, maxR = -1, maxRDate = null, mostReps = -1, mostRepsDate = null;
    for (const x of h) {
      if (x.maxW > maxW) { maxW = x.maxW; maxWDate = x.date; }
      if (x.best > best) { best = x.best; top = x.top; bestDate = x.date; }
      if (x.maxR > maxR) { maxR = x.maxR; maxRDate = x.date; }
      if (x.reps > mostReps) { mostReps = x.reps; mostRepsDate = x.date; }
    }
    return { maxW, maxWDate, best, top, bestDate, maxR, maxRDate, mostReps, mostRepsDate, sessions: h.length, last: h[h.length - 1].date };
  },
  repMax(exId) {        // peso máximo levantado para cada número de repeticiones
    const ex = this.ex(exId); if (this.isCardio(ex) || this.isBW(ex)) return [];
    const map = {};
    for (const x of this.history(exId)) for (const s of x.sets) {
      if (!(s.r > 0)) continue;
      const w = s.w || 0, cur = map[s.r];
      if (!cur || w > cur.w || (w === cur.w && x.date > cur.date)) map[s.r] = { r: s.r, w, f: s.f, ds: s.ds, date: x.date };
    }
    return Object.values(map).sort((a, b) => a.r - b.r);
  },
  planText(ex, plan) {
    if (!plan.length) return '';
    if (this.isBW(ex)) plan = plan.map(r => ({ ...r, ds: false }));
    if (this.isCardio(ex)) return plan.map(s => this.setText(ex, s)).join(' · ');
    const same = plan.every(s => (this.isBW(ex) || s.w === plan[0].w) && (s.f || s.r === plan[0].r) && s.f === plan[0].f && !!s.ds === !!plan[0].ds), n = plan.length, p = plan[0];
    if (same) {
      const reps = p.f ? (p.ds ? 'Al fallo + DS' : 'Al fallo') : p.r != null ? `${p.r} reps` : '? reps';
      return `${reps} × ${n} ${n === 1 ? 'serie' : 'series'}${p.w != null && !this.isBW(ex) ? ' · ' + this.load(ex, p.w) : ''}`;
    }
    return plan.map(s => (s.w != null && !this.isBW(ex) ? this.load(ex, s.w) + ' × ' : '') + this.planReps(s)).join(' · ');
  },
  /* Estado de un ejercicio: compara REALIZADO con PREVISTO serie a serie.
     Fuerza: con carga en ambos se compara el 1RM estimado (peso y reps a la vez); si no, las reps.
     Cardio: más minutos es mejor; con los mismos minutos decide la intensidad.
     Series previstas sin hacer restan; series extra suman.  →  '+', '=' o '-' (null si no hay nada hecho) */
  cmpSet(p, d) {
    if (!this.done(d)) return -1;
    if (p.f) p = { ...p, r: null };   // previsto "al fallo": no hay nº de reps con el que comparar
    const sign = (a, b) => Math.abs(a - b) <= Math.max(Math.abs(b), 1) * 0.005 ? 0 : Math.sign(a - b);
    if (p.w != null && d.w != null) {
      if (p.r != null && d.r != null) return sign(U.epley(d.w, d.r), U.epley(p.w, p.r));
      return sign(d.w, p.w);
    }
    if (p.r != null && d.r != null) return Math.sign(d.r - p.r);
    return 0;
  },
  cmpCardio(p, d) {
    if (!(d && d.m > 0)) return -1;
    if (p.m != null && d.m !== p.m) return Math.sign(d.m - p.m);
    if (p.i && d.i) return Math.sign(d.i - p.i);
    return 0;
  },
  status(it) {
    if (!this.validSets(it.log).length) return null;
    const ex = this.ex(it.exerciseId), c = this.isCardio(ex), bw = this.isBW(ex); let s = 0;
    const noW = r => r && bw ? { ...r, w: null } : r;
    it.plan.forEach((p, i) => { s += c ? this.cmpCardio(p, it.log[i]) : this.cmpSet(noW(p), noW(it.log[i])); });
    s += it.log.slice(it.plan.length).filter(this.done).length;
    return s > 0 ? '+' : s < 0 ? '-' : '=';
  },
  // biserie / triserie: 2 o 3 ejercicios seguidos con el mismo "ss" (A, B, C según el orden)
  SS_MAX: 3,
  mates(list, it) { return it?.ss ? (list || []).filter(x => x.ss === it.ss) : []; },
  ssName(n) { return n >= 3 ? 'Triserie' : 'Biserie'; },
  // deja solo grupos válidos: de 2 a 3 ejercicios de fuerza seguidos
  fixSS(list) {
    if (!list) return;
    const seen = new Set();
    for (let i = 0; i < list.length; i++) {
      const it = list[i]; if (!it.ss) continue;
      let j = i; while (list[j + 1]?.ss === it.ss) j++;
      const run = list.slice(i, j + 1);
      run.slice(this.SS_MAX).forEach(x => delete x.ss);
      const g = run.slice(0, this.SS_MAX);
      if (seen.has(it.ss) || g.length < 2 || g.some(x => this.isCardio(this.ex(x.exerciseId)))) g.forEach(x => delete x.ss);
      else seen.add(it.ss);
      i = j;
    }
  },
  isGymDay(date) { return this.day(date).some(it => this.validSets(it.log).length); }
};

/* Progreso */
const Perf = {
  weeks() { const m = U.monday(U.today()); return Array.from({ length: WEEKS_SHOWN }, (_, k) => U.addDays(m, -7 * (WEEKS_SHOWN - 1 - k))); },
  // índice de rendimiento (1RM estimado relativo a tu primera marca) y volumen (kg × reps). El cardio va aparte.
  calc() {
    const weeks = this.weeks(), per = {}, base = {};
    for (const e of DB.d.exercises) {
      if (DB.isCardio(e)) continue;
      let h = DB.history(e.id); if (!h.length) continue;
      // con peso: 1RM estimado; si nunca apuntas peso (ej. corporales): reps de la mejor serie
      const weighted = h.some(x => x.best > 0), metric = x => weighted ? x.best : x.maxR;
      h = h.filter(x => metric(x) > 0); if (!h.length) continue;
      base[e.id] = metric(h[0]);
      per[e.id] = weeks.map(mon => {
        const end = U.addDays(mon, 6), inW = h.filter(x => x.date >= mon && x.date <= end);
        return inW.length ? { best: Math.max(...inW.map(metric)), vol: inW.reduce((s, x) => s + x.vol, 0) } : null;
      });
    }
    const ids = Object.keys(per);
    const idx = weeks.map((_, i) => { const v = ids.filter(id => per[id][i]).map(id => per[id][i].best / base[id] * 100); return v.length ? U.avg(v) : null; });
    const vol = weeks.map((_, i) => ids.reduce((s, id) => s + (per[id][i]?.vol || 0), 0));
    return { weeks, per, idx, vol };
  },
  explain(p) {
    const done = p.idx.map((v, i) => v == null ? -1 : i).filter(i => i >= 0);
    if (done.length < 2) return '<div class="explain muted">Necesitas al menos dos semanas con series realizadas para comparar.</div>';
    const i = done[done.length - 1], j = done[done.length - 2];
    const changes = Object.keys(p.per).filter(id => p.per[id][i] && p.per[id][j])
      .map(id => ({ id, c: (p.per[id][i].best / p.per[id][j].best - 1) * 100 })).sort((a, b) => b.c - a.c);
    const ups = changes.filter(x => x.c > 0.5).slice(0, 3), downs = changes.filter(x => x.c < -0.5).reverse().slice(0, 3);
    const dIdx = p.idx[i] - p.idx[j], dVol = p.vol[j] ? (p.vol[i] / p.vol[j] - 1) * 100 : 0;
    const fmtList = l => l.map(x => `${U.esc(DB.exName(x.id))} (${U.pct(x.c)})`).join(', ');
    let t = `<div class="explain">Semana del <b>${U.fmt(p.weeks[i])}</b> frente a la del ${U.fmt(p.weeks[j])}: rendimiento <span class="${dIdx >= 0 ? 'up' : 'down'}">${dIdx >= 0 ? '▲' : '▼'} ${U.kg(Math.round(Math.abs(dIdx) * 10) / 10)} pts</span> · volumen <span class="${dVol >= 0 ? 'up' : 'down'}">${U.pct(dVol)}</span>.</div>`;
    if (ups.length) t += `<div class="explain"><span class="up">Sube por:</span> ${fmtList(ups)}</div>`;
    if (downs.length) t += `<div class="explain"><span class="down">Baja por:</span> ${fmtList(downs)}</div>`;
    if (!changes.length) t += '<div class="explain muted">Esas dos semanas no comparten ejercicios, así que el cambio se debe a qué ejercicios hiciste.</div>';
    return t;
  },
  // contador de verdes (= o +) y rojos (−)
  score(from = '0000', to = '9999') {
    let g = 0, r = 0;
    for (const d of Object.keys(DB.d.days)) if (d >= from && d <= to) for (const it of DB.d.days[d]) {
      const s = DB.status(it); if (s === '-') r++; else if (s) g++;
    }
    return { g, r };
  },
  // totales generales desde el último "Restablecer": lo de días posteriores + lo que se sumó ese mismo día después de restablecer
  scoreTotal() {
    const r = Store.data.account.resets?.score; if (!r) return this.score();
    const after = this.score(U.addDays(r.d, 1)), day = this.score(r.d, r.d);
    return { g: after.g + Math.max(0, day.g - r.g), r: after.r + Math.max(0, day.r - r.r) };
  },
  cardioTotal() {
    const r = Store.data.account.resets?.cardio; if (!r) return this.cardio();
    return this.cardio(U.addDays(r.d, 1)) + Math.max(0, this.cardio(r.d, r.d) - r.m);
  },
  // minutos de cardio realizados
  cardio(from = '0000', to = '9999') {
    let m = 0;
    for (const d of Object.keys(DB.d.days)) if (d >= from && d <= to) for (const it of DB.d.days[d])
      if (DB.isCardio(DB.ex(it.exerciseId))) m += DB.validSets(it.log).reduce((s, x) => s + (x.m || 0), 0);
    return m;
  }
};

/* ===================== CONTADOR DE DÍAS =====================
   - Vas n días a la semana (elegido en el alta; se puede cambiar y vale desde esa semana).
   - Solo cuentan días ya pasados (hoy cuenta solo si ya has entrenado).
   - Cada semana tienes 7−n descansos: los primeros días sin ir son descanso y no suman.
   - Si después vuelves a faltar, es una falta y sí suma (salvo que la justifiques).
   Resultado: días entrenados / (días entrenados + faltas).                                         */
const Gym = {
  goals() { const g = DB.d.account?.goals; return g && g.length ? [...g].sort((a, b) => a.from.localeCompare(b.from)) : [{ from: '0000-00-00', n: DEFAULT_GOAL }]; },
  goalFor(mon) { let n = this.goals()[0].n; for (const g of this.goals()) if (g.from <= mon) n = g.n; return n; },
  current() { return this.goalFor(U.monday(U.today())); },
  setGoal(n) {
    const mon = U.monday(U.today());
    DB.d.account.goals = this.goals().filter(g => g.from < mon).concat([{ from: mon, n }]);
    Store.save();
  },
  // estado de cada día de la semana: before · future · today · gym · rest · miss · excused
  week(mon) {
    const today = U.today(), created = DB.d.account?.createdAt || today, rest = 7 - this.goalFor(mon); let used = 0;
    return [0, 1, 2, 3, 4, 5, 6].map(i => {
      const d = U.addDays(mon, i); let s;
      if (d < created) s = 'before';
      else if (d > today) s = 'future';
      else if (DB.isGymDay(d)) s = 'gym';
      else if (d === today) s = 'today';
      else if (DB.d.excused?.[d]) s = 'excused';
      else if (used < rest) { used++; s = 'rest'; }
      else s = 'miss';
      return { d, s };
    });
  },
  count(days) { const c = { gym: 0, miss: 0, rest: 0, excused: 0 }; days.forEach(x => { if (c[x.s] != null) c[x.s]++; }); c.total = c.gym + c.miss; return c; },
  totals() {
    const created = DB.d.account?.createdAt || U.today(), last = U.monday(U.today()), all = [];
    for (let m = U.monday(created); m <= last; m = U.addDays(m, 7)) all.push(...this.week(m));
    return this.count(all);
  },
  // faltas recientes (justificadas o no), de más nueva a más antigua
  recent(weeks = 6) {
    const out = [], thisMon = U.monday(U.today());
    for (let k = 0; k < weeks; k++) out.push(...this.week(U.addDays(thisMon, -7 * k)).filter(x => x.s === 'miss' || x.s === 'excused'));
    return out.sort((a, b) => b.d.localeCompare(a.d));
  },
  excuse(d) { DB.d.excused ||= {}; if (DB.d.excused[d]) delete DB.d.excused[d]; else DB.d.excused[d] = true; Store.save(); }
};

/* ===================== 6. GRÁFICAS (canvas, sin librerías) ===================== */
const Chart = {
  live: [],
  draw(cv, pts, opts = {}) {
    if (!cv) return;
    this.live = this.live.filter(x => x.cv.isConnected && x.cv !== cv);
    this.live.push({ cv, pts, opts }); this.render(cv, pts, opts);
  },
  redrawAll() { this.live = this.live.filter(x => x.cv.isConnected); this.live.forEach(x => this.render(x.cv, x.pts, x.opts)); },
  // escala de 100 en 100 (en múltiplos redondos para que no salgan 30 líneas)
  step100(max) { const raw = max / 5; return [100, 200, 300, 400, 500, 1000, 1500, 2000, 2500, 5000, 10000, 20000, 50000, 100000].find(s => s >= raw) || 100000; },
  render(cv, pts, { type = 'line', ref = null, yTitle = null, fmt = U.compact } = {}) {   // pts: [{label, y}] — y puede ser null
    const dpr = (window.devicePixelRatio || 1) * Look.scale(), w = cv.clientWidth || 300, h = cv.clientHeight || 260;
    cv.width = w * dpr; cv.height = h * dpr;
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
    const cText = col('--muted'), cLine = col('--line'), cAcc = col('--accent'), cAcc2 = col('--accent-2'), cCard = col('--card'), cMain = col('--text');
    const FONT = '"Plus Jakarta Sans",-apple-system,system-ui,sans-serif';
    ctx.font = `600 11px ${FONT}`;
    const valid = pts.map((p, i) => ({ ...p, i })).filter(p => p.y != null && (type !== 'bar' || p.y > 0));
    if (!valid.length) { ctx.fillStyle = cText; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `600 13px ${FONT}`; ctx.fillText('Sin datos todavía', w / 2, h / 2); return; }
    let L, ticks = [], min, max;
    if (type === 'bar') {
      const top = Math.max(...valid.map(p => p.y)), step = this.step100(top);
      min = 0; max = Math.ceil(top / step) * step; if (max === top) max += step;
      for (let v = 0; v <= max; v += step) ticks.push(v);
      L = Math.max(...ticks.map(v => ctx.measureText(U.int(v)).width)) + 12;
    } else {
      const ys = valid.map(p => p.y).concat(ref != null ? [ref] : []);
      min = Math.min(...ys); max = Math.max(...ys); if (min === max) { min -= 1; max += 1; }
      const pad = (max - min) * .18; min -= pad; max += pad * 1.6;
      L = yTitle ? 28 : 12;
    }
    const R = 14, T = 16, B = 30, pw = w - L - R, ph = h - T - B;
    const Y = v => T + ph - (v - min) / (max - min) * ph;
    ctx.strokeStyle = cLine; ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
    if (type === 'bar') {
      ctx.fillStyle = cText; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ticks.forEach(v => { const y = Y(v); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - R, y); ctx.stroke(); ctx.fillText(U.int(v), L - 8, y); });
    } else for (let i = 0; i <= 4; i++) { const y = T + ph * i / 4; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - R, y); ctx.stroke(); }
    ctx.setLineDash([]);
    if (yTitle) { ctx.save(); ctx.translate(11, T + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = cText; ctx.font = `700 11px ${FONT}`; ctx.fillText(yTitle, 0, 0); ctx.restore(); }
    const n = pts.length, slot = pw / n;
    const X = i => type === 'bar' ? L + slot * (i + .5) : (n === 1 ? L + pw / 2 : L + 8 + (pw - 16) * i / (n - 1));
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = cText; ctx.font = `600 11px ${FONT}`;
    const step = Math.max(1, Math.ceil(n / (w < 420 ? 4 : 6)));
    for (let i = n - 1; i >= 0; i -= step) { const tw = ctx.measureText(pts[i].label).width / 2; ctx.fillText(pts[i].label, Math.min(Math.max(X(i), L + tw), w - R - tw), h - B + 10); }
    if (ref != null && type !== 'bar') {
      ctx.setLineDash([6, 5]); ctx.strokeStyle = cText; ctx.globalAlpha = .5; ctx.beginPath(); ctx.moveTo(L, Y(ref)); ctx.lineTo(w - R, Y(ref)); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = cText; ctx.font = `600 10px ${FONT}`; ctx.fillText('inicio', L + 4, Y(ref) - 3);
    }
    if (type === 'bar') {
      const bw = Math.min(30, slot * .62), showVals = slot >= 38;
      valid.forEach(p => {
        const y = Y(p.y), x = X(p.i) - bw / 2, hh = T + ph - y;
        const g = ctx.createLinearGradient(0, y, 0, T + ph); g.addColorStop(0, cAcc2); g.addColorStop(1, cAcc);
        ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, bw, hh, [7, 7, 2, 2]) : ctx.rect(x, y, bw, hh); ctx.fill();
        if (showVals) { ctx.fillStyle = cMain; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.font = `700 10px ${FONT}`; ctx.fillText(U.compact(p.y), X(p.i), y - 4); }
      });
      return;
    }
    const P = valid.map(p => ({ x: X(p.i), y: Y(p.y), v: p.y }));
    const path = () => { ctx.moveTo(P[0].x, P[0].y); for (let k = 1; k < P.length; k++) { const a = P[k - 1], b = P[k], mx = (a.x + b.x) / 2; ctx.bezierCurveTo(mx, a.y, mx, b.y, b.x, b.y); } };
    if (P.length > 1) {
      const area = ctx.createLinearGradient(0, T, 0, T + ph); area.addColorStop(0, cAcc + '55'); area.addColorStop(1, cAcc + '00');
      ctx.beginPath(); path(); ctx.lineTo(P[P.length - 1].x, T + ph); ctx.lineTo(P[0].x, T + ph); ctx.closePath(); ctx.fillStyle = area; ctx.fill();
      const stroke = ctx.createLinearGradient(L, 0, w - R, 0); stroke.addColorStop(0, cAcc2); stroke.addColorStop(1, cAcc);
      ctx.save(); ctx.shadowColor = cAcc + '66'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
      ctx.beginPath(); path(); ctx.strokeStyle = stroke; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
    }
    P.forEach((p, k) => {
      const last = k === P.length - 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, last ? 6 : 3.5, 0, Math.PI * 2); ctx.fillStyle = cCard; ctx.fill(); ctx.strokeStyle = cAcc; ctx.lineWidth = last ? 3 : 2; ctx.stroke();
    });
    const lp = P[P.length - 1], txt = fmt(lp.v); ctx.font = `800 12px ${FONT}`;
    const bw = ctx.measureText(txt).width + 14, bx = Math.min(Math.max(lp.x - bw / 2, L), w - R - bw), by = Math.max(lp.y - 34, 2);
    ctx.fillStyle = cAcc; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, bw, 22, 8) : ctx.rect(bx, by, bw, 22); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, bx + bw / 2, by + 11);
  }
};

    h += '<div class="week" id="week">';

    const TAGS = { rest: '<span class="dstate rst">Descanso</span>', miss: '<span class="dstate miss">Falta</span>', excused: '<span class="dstate excused">Justificada</span>' };
    for (let i = 0; i < 7; i++) {

      h += `<div class="col ${date === today ? 'today' : ''}" data-sort-date="${date}">
        <div class="col-head"><b>${DAYS_S[i]} ${U.parse(date).getDate()}</b>${TAGS[st] || ''}</div>
        ${st === 'miss' ? `<button class="btn sm soft excuse" data-act="excuse" data-date="${date}">Justificar falta</button>` : ''}
        ${st === 'excused' ? `<button class="btn sm ghost excuse" data-act="excuse" data-date="${date}">Quitar justificación</button>` : ''}
        ${items.length ? UI.dayItems(items, it => `data-act="item-open" data-date="${date}" data-id="${it.id}"`, true, canSort) : (st === 'rest' ? '' : '<div class="rest">Nada previsto</div>')}
        ${isPast(date) ? '' : `<button class="btn add" data-act="day-add" data-date="${date}">+ Añadir ejercicio</button>`}
        ${note ? `<button class="note-chip" data-act="note-open" data-date="${date}" title="Nota del día"><b>📝 Nota${note.r ? ` · <span class="nstars">${'★'.repeat(note.r)}</span>` : ''}</b>${note.t ? `<span>${U.esc(note.t)}</span>` : ''}</button>`
               : `<button class="btn add note-add" data-act="note-open" data-date="${date}">+ Añadir nota</button>`}</div>`;
    }
    return h + '</div>';
  },
  mount(el) {
    const strip = $('#week', el); if (!strip) return;
    if (ui.stripX != null) strip.scrollLeft = ui.stripX;
    else { const t = $('.col.today', strip); if (t) strip.scrollLeft = t.offsetLeft - strip.offsetLeft - 16; }
    strip.addEventListener('scroll', () => { ui.stripX = strip.scrollLeft; }, { passive: true });
    Drag.attach(strip);
    // rueda del ratón: subir → izquierda, bajar → derecha (cuando la semana no cabe entera)
    strip.addEventListener('wheel', e => {
      if (strip.scrollWidth <= strip.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      const max = strip.scrollWidth - strip.clientWidth, before = strip.scrollLeft;
      if ((e.deltaY < 0 && before <= 0) || (e.deltaY > 0 && before >= max - 1)) return;   // en el borde: deja bajar la página
      e.preventDefault(); strip.scrollLeft = before + e.deltaY;
    }, { passive: false });
  }
};

/* Arrastrar la semana con el ratón (con el dedo ya se desliza solo) */
const Drag = {
  attach(el) {
    let down = false, sx = 0, sl = 0, moved = false;
    el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('input,select,textarea,.grip')) return; down = true; moved = false; sx = e.clientX; sl = el.scrollLeft; });
    el.addEventListener('pointermove', e => {
      if (!down) return; const dx = e.clientX - sx;
      if (!moved && Math.abs(dx) > 6) { moved = true; el.classList.add('dragging'); }
      if (moved) el.scrollLeft = sl - dx;
    });
    const end = () => { if (!down) return; down = false; setTimeout(() => { el.classList.remove('dragging'); moved = false; }, 0); };
    el.addEventListener('pointerup', end); el.addEventListener('pointerleave', end);
    el.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); } }, true);
  }
};

/* Ejercicio de un día (PREVISTO + REALIZADO) o de una rutina prefabricada (solo PREVISTO) */
const ItemSheet = {
  open(ref) { ui.item = ref; UI.open('<div id="its"></div>', () => this.draw()); },
  list() {
    const r = ui.item || {};
    return r.kind === 'tpl' ? DB.tpl(r.tid)?.days[r.d] || [] : DB.day(r.date);
  },
  get() { return this.list().find(i => i.id === ui.item?.id); },
  byId(id) { return this.list().find(i => i.id === id); },
  // días ya pasados: se pueden ver, no editar
  ro() { return ui.item?.kind === 'day' && isPast(ui.item.date); },
  remove() {
    const r = ui.item;
    if (r.kind === 'tpl') { const t = DB.tpl(r.tid); t.days[r.d] = t.days[r.d].filter(i => i.id !== r.id); DB.fixSS(t.days[r.d]); }
    else { Store.data.days[r.date] = DB.day(r.date).filter(i => i.id !== r.id); DB.fixSS(Store.data.days[r.date]); if (!Store.data.days[r.date].length) delete Store.data.days[r.date]; }
    Store.save();
  },
  draw() {
    const box = $('#its'), it = this.get(); if (!box) return;
    if (!it) { box.innerHTML = UI.head('Ejercicio quitado'); return; }
    const group = DB.mates(this.list(), it);
    if (group.length > 1) return this.drawSS(box, group);
    const r = ui.item, ex = DB.ex(it.exerciseId), isTpl = r.kind === 'tpl', cardio = DB.isCardio(ex);
    const ro = this.ro(), sub = isTpl ? `${U.esc(DB.tpl(r.tid).name)} · ${DAYS[r.d]}` : U.fmtLong(r.date) + (ro ? ' · solo lectura' : '');
    let h = `${UI.head(U.esc(DB.exName(it.exerciseId)), sub)}
      <div class="row wrap" style="margin:-4px 0 12px">${UI.tag(ex)}<span class="muted small">${cardio ? 'Minutos e intensidad' : 'Carga: ' + LOADS[ex?.load || 'kg'].name}</span></div>
      <div class="card sec-plan"><div class="sec-title"><h3>Previsto</h3></div>${UI.setsTable(ex, it.plan, 'plan', null, ro)}</div>`;
    if (!isTpl) {
      const last = DB.last(it.exerciseId, r.date), st = DB.status(it);
      h += `<div class="card sec-done"><div class="sec-title"><h3>Realizado</h3><div class="row">${UI.status(st)}${ro ? '' : '<button class="btn sm" data-act="copy-plan">Igual que lo previsto</button>'}</div></div>
        <div class="hint" style="margin-top:0">${last ? `Última vez (${U.fmt(last.date)}): ${last.sets.map(s => DB.setText(ex, s)).join(' · ')}` : 'Primera vez con este ejercicio'}</div>
        ${UI.setsTable(ex, it.log, 'log', it.plan, ro)}</div>`;
    }
    h += ro ? '<div class="hint" style="text-align:center">Este día ya ha pasado: puedes verlo, pero no modificarlo.</div>'
      : `${cardio ? '' : '<button class="btn block" data-act="ss-make" style="margin-bottom:8px">⇄ Hacer biserie con otro ejercicio</button>'}
         <button class="btn ghost danger block" data-act="item-del">${isTpl ? 'Quitar de la rutina' : 'Quitar del día'}</button>`;
    box.innerHTML = h;
  },
  // biserie/triserie: los ejercicios en la misma ficha, con las series intercaladas
  drawSS(box, group) {
    const r = ui.item, isTpl = r.kind === 'tpl', ro = this.ro(), L = 'ABC', n = group.length, name = DB.ssName(n);
    const sub = (isTpl ? `${U.esc(DB.tpl(r.tid).name)} · ${DAYS[r.d]}` : U.fmtLong(r.date)) + (ro ? ' · solo lectura' : '');
    const who = (it, j) => { const ex = DB.ex(it.exerciseId); return `<div class="ss-who" data-rid="${it.id}">${ro ? '' : '<span class="grip" data-act="grip" title="Arrastra para cambiar el orden" aria-label="Reordenar">⠿</span>'}<i class="ssk ${L[j].toLowerCase()}">${L[j]}</i><span class="dot" style="background:${DB.color(it.exerciseId)}"></span><b>${U.esc(DB.exName(it.exerciseId))}</b><span class="muted small">${LOADS[ex?.load || 'kg'].name}</span>${isTpl ? '' : UI.status(DB.status(it))}${ro ? '' : `<button class="icon-btn" data-act="ss-out" data-id="${it.id}" title="Sacar de la ${name.toLowerCase()}" aria-label="Sacar">✕</button>`}</div>`; };
    let h = `${UI.head('⇄ ' + name, sub)}
      <div class="card ss-whos" data-sort-ss="1" style="padding:8px 12px">${group.map(who).join('')}</div>
      <div class="card sec-plan"><div class="sec-title"><h3>Previsto</h3></div>${UI.ssTable(group, 'plan', ro)}</div>`;
    if (!isTpl) {
      const last = group.map((g, j) => { const l = DB.last(g.exerciseId, r.date), ex = DB.ex(g.exerciseId); return l ? `<div>${L[j]} · última vez (${U.fmt(l.date)}): ${l.sets.map(s => DB.setText(ex, s)).join(' · ')}</div>` : ''; }).join('');
      h += `<div class="card sec-done"><div class="sec-title"><h3>Realizado</h3>${ro ? '' : '<button class="btn sm" data-act="copy-plan" data-x="both">Igual que lo previsto</button>'}</div>
        <div class="hint" style="margin-top:0">${last || 'Primera vez con estos ejercicios'}</div>
        ${UI.ssTable(group, 'log', ro)}</div>`;
    }
    const todos = n === 3 ? 'los tres' : 'los dos';
    h += ro ? '<div class="hint" style="text-align:center">Este día ya ha pasado: puedes verlo, pero no modificarlo.</div>'
      : `${n < DB.SS_MAX ? '<button class="btn block" data-act="ss-make" style="margin-bottom:8px">⇄ Añadir otro ejercicio (triserie)</button>' : ''}
         <div class="row"><button class="btn grow" data-act="ss-split">Separar ${name.toLowerCase()}</button><button class="btn ghost danger grow" data-act="ss-del">${isTpl ? 'Quitar ' + todos : 'Quitar ' + todos + ' del día'}</button></div>`;
    box.innerHTML = h;
  }
};

const ExerciseForm = {
  open(id, onSaved) {
    const e = id ? DB.ex(id) : null; this.id = id; this.onSaved = onSaved; this.loadType = e && !DB.isCardio(e) ? e.load : 'kg';
    const g0 = e?.group || (GROUPS.some(g => g.id === ui.pick?.g) && ui.pick.g) || (GROUPS.some(g => g.id === ui.group) && ui.group) || GROUPS[0].id;
    const m0 = e?.muscle || DB.group(g0).muscles[0];
    UI.open(`${UI.head(e ? 'Editar ejercicio' : 'Nuevo ejercicio')}
      <div class="row"><label class="field grow">Grupo<select id="exf-g" data-ch="exf-group">${GROUPS.map(g => `<option value="${g.id}" ${g.id === g0 ? 'selected' : ''}>${g.name}</option>`).join('')}</select></label>
      <label class="field grow"><span id="exf-m-lbl">${DB.group(g0).cardio ? 'Tipo' : 'Músculo'}</span><select id="exf-m" data-ch="exf-muscle">${this.muscles(g0, m0)}</select></label></div>
      <label class="field mt" id="exf-name-wrap" ${this.needsName(g0, m0) ? '' : 'hidden'}>Nombre<input id="exf-name" value="${U.esc(e?.name || '')}" placeholder="${DB.group(g0).cardio ? 'Ej. Spinning' : 'Ej. Press banca'}"></label>
      <div id="exf-load-wrap" ${DB.group(g0).cardio ? 'hidden' : ''}><div class="field mt">Tipo de carga</div><div class="seg" style="margin-top:4px" id="exf-load">${this.loadSeg()}</div>
      <div class="hint" id="exf-load-hint">${this.loadHint()}</div></div>
      <div class="hint" id="exf-cardio-hint" ${DB.group(g0).cardio ? '' : 'hidden'}>En cardio el nombre es el tipo (solo pide nombre si eliges “Otro”) y apuntarás minutos e intensidad en lugar de kg y repeticiones.</div>
      <button class="btn primary block mt2" data-act="exf-save">Guardar</button>`);
  },
  loadSeg() { return ['kg', 'side', 'plates', 'bw'].map(k => `<button class="${k === this.loadType ? 'on' : ''}" data-act="exf-load" data-v="${k}">${LOADS[k].name}</button>`).join(''); },
  loadHint() { return { kg: 'Peso total en kg (ej. 80 kg).', side: 'Peso de cada lado (ej. 15 kg por lado → 15 - 15).', plates: 'Número de placa de la máquina, de 1 a 50.', bw: 'Sin peso: solo apuntarás repeticiones (dominadas, fondos, flexiones…).' }[this.loadType]; },
  muscles(gid, sel) { return DB.group(gid).muscles.map(m => `<option ${m === sel ? 'selected' : ''}>${m}</option>`).join(''); },
  // en cardio el tipo es el nombre, salvo "Otro"
  needsName(gid, muscle) { return !DB.group(gid).cardio || muscle === 'Otro'; },
  syncName() {
    const top = UI.top(), g = $('#exf-g', top).value, m = $('#exf-m', top).value;
    $('#exf-name-wrap', top).hidden = !this.needsName(g, m);
    $('#exf-name', top).placeholder = DB.group(g).cardio ? 'Ej. Spinning' : 'Ej. Press banca';
  },
  save() {
    const top = UI.top(), group = $('#exf-g', top).value, muscle = $('#exf-m', top).value, list = Store.data.exercises;
    const name = this.needsName(group, muscle) ? $('#exf-name', top).value.trim() : muscle;
    const load = DB.group(group).cardio ? 'cardio' : this.loadType;
    if (!name) return UI.toast('Ponle un nombre');
    if (name.length > 60) return UI.toast('El nombre es demasiado largo (máx. 60)');
    if (!this.id && list.length >= LIMITS.exercises) return UI.toast(`Máximo ${LIMITS.exercises} ejercicios`);
    if (list.some(x => x.name.toLowerCase() === name.toLowerCase() && x.id !== this.id)) return UI.toast(`Ya tienes un ejercicio llamado "${name}"`);
    let id = this.id;
    if (id) {
      const e = DB.ex(id), was = DB.isCardio(e);
      Object.assign(e, { name, group, muscle, load });
      if (load === 'bw') {
        const noDS = it => { if (it.exerciseId === id) [it.plan, it.log].forEach(rows => rows?.forEach(r => { r.ds = false; })); };
        Object.values(Store.data.days).forEach(d => d.forEach(noDS)); Store.data.templates.forEach(t => t.days.forEach(d => d.forEach(noDS)));
      }
      // si cambia entre fuerza y cardio, las filas de ese ejercicio se reinician a su nuevo formato
      if (was !== DB.isCardio(e)) {
        const fix = it => { if (it.exerciseId !== id) return; it.plan = DB.newPlan(e); if (it.log) it.log = it.plan.map(() => DB.blank(e)); };
        Object.values(Store.data.days).forEach(d => d.forEach(fix)); Store.data.templates.forEach(t => t.days.forEach(d => d.forEach(fix)));
      }
    } else { id = U.slug(name) || 'ejercicio'; if (DB.ex(id)) id += '-' + U.uid().slice(-4); list.push({ id, name, group, muscle, load, rating: 0, pinned: false, notes: '' }); }
    Store.save(); UI.close(); UI.toast('Ejercicio guardado'); this.onSaved?.(id);
  }
};

        <div class="hint mt">${rec ? `${rec.sessions} ${rec.sessions === 1 ? 'sesión' : 'sesiones'} · peso corporal (solo repeticiones).` : 'Aparecerá cuando registres series realizadas.'}</div>`;
