        <div class="card mt"><h3>Peso máximo según repeticiones</h3>${rm.length ? `<table class="rm"><thead><tr><th>Reps</th><th>Peso máx</th><th class="r">Fecha</th></tr></thead><tbody>
          ${rm.map(x => `<tr><td>${x.r}${x.f ? ` <span class="tag" style="--c:var(--bad)">${x.ds ? 'FALLO + DS' : 'FALLO'}</span>` : ''}</td><td class="w">${DB.load(e, x.w)}</td><td class="muted r">${U.fmtY(x.date)}</td></tr>`).join('')}</tbody></table>`

      <div class="row"><button class="btn grow" data-act="ex-edit">Editar</button><button class="btn ghost danger grow" data-act="ex-del">Eliminar</button></div>`;

/* ===================== 10. ACCIONES (delegación de eventos) =====================
   Para añadir una función: pon data-act="nombre" (click), data-in="nombre" (al escribir)
   o data-ch="nombre" (al cambiar) en el HTML y añade H['nombre'] = (el, e) => {...}            */
const curItem = () => ItemSheet.get();
const curEx = () => DB.ex(curItem()?.exerciseId);
const rowsOf = t => curItem()?.[t === 'plan' ? 'plan' : 'log'];
const rowItem = el => el.dataset.x && el.dataset.x !== 'both' ? ItemSheet.byId(el.dataset.x) : curItem();   // en biseries cada fila indica su ejercicio
const rowsFor = el => rowItem(el)?.[el.dataset.t === 'plan' ? 'plan' : 'log'];
const addRow = (it, type) => {
  const ex = DB.ex(it.exerciseId), rows = it[type === 'plan' ? 'plan' : 'log'], p = rows[rows.length - 1];
  if (rows.length >= LIMITS.sets) { UI.toast(`Máximo ${LIMITS.sets} series`); return false; }
  if (DB.isCardio(ex)) rows.push(U.crow(p));
  else rows.push(type === 'plan' ? U.row(p) : U.row({ w: p?.w, r: p?.r }));
  // si aún no has hecho nada, lo realizado acompaña a lo previsto en número de series
  if (type === 'plan' && it.log && !DB.validSets(it.log).length && it.log.length < it.plan.length) it.log.push(DB.blank(ex));
  return true;
};
const redrawModals = () => { ItemSheet.draw(); ExerciseDetail.draw(); TemplateEditor.draw(); };
const H = {
  tab: el => App.go(el.dataset.t),
  'modal-close': () => { UI.close(); if (!UI.stack.length) App.render(); else redrawModals(); },

  // Rutina
  'week-shift': el => { ui.weekOff += +el.dataset.n; ui.stripX = null; App.render(); },
  'week-now': () => { ui.weekOff = 0; ui.stripX = null; App.render(); },
  'week-copy': () => {
    const mon = weekMon();
    for (let i = 0; i < 7; i++) { const d = U.addDays(mon, i), src = DB.day(U.addDays(mon, i - 7)); if (!isPast(d) && src.length) { Store.data.days[d] = copyItems(src, true); DB.fixSS(Store.data.days[d]); } }
    Store.save(); App.render(); UI.toast('Semana copiada (solo lo previsto)');
  },
  'week-save': () => {
    const name = prompt('Nombre de la rutina:', 'Mi rutina'); if (!name || !name.trim()) return;
    const mon = weekMon();
    Store.data.templates.push({ id: U.uid(), name: name.trim(), days: [0, 1, 2, 3, 4, 5, 6].map(i => copyItems(DB.day(U.addDays(mon, i)), false)) });
    Store.save(); UI.toast('Rutina guardada en Ajustes');
  },
  'tpl-apply': () => UI.open(`${UI.head('Aplicar rutina', 'Semana del ' + U.fmt(weekMon()))}
    ${Store.data.templates.map(t => `<div class="list-item clickable" data-act="tpl-use" data-id="${t.id}"><div class="grow"><div class="bold">${U.esc(t.name)}</div>
      <div class="muted small">${t.days.map((d, i) => d.length ? DAYS_S[i] : null).filter(Boolean).join(', ') || 'Vacía'}</div></div><span style="color:var(--accent);font-weight:800">Aplicar</span></div>`).join('')}`),
  'tpl-use': el => {
    const t = DB.tpl(el.dataset.id), mon = weekMon();
    const has = [0, 1, 2, 3, 4, 5, 6].some(i => { const d = U.addDays(mon, i); return !isPast(d) && DB.day(d).length; });
    const partial = isPast(mon);
    if (has && !confirm(`Los días ${partial ? 'que quedan de esta semana' : 'de esta semana'} ya tienen ejercicios. Se sustituirán por los de la rutina (también lo realizado). ¿Continuar?`)) return;
    for (let i = 0; i < 7; i++) {
      const date = U.addDays(mon, i);
      if (isPast(date)) continue;   // los días pasados no se tocan
      if (t.days[i].length) Store.data.days[date] = copyItems(t.days[i], true); else delete Store.data.days[date];
    }
    Store.save(); UI.close(); App.render(); UI.toast(`Rutina "${t.name}" aplicada`);
  },
  'day-add': el => {
    const date = el.dataset.date; if (isPast(date)) return;
    if (DB.day(date).length >= LIMITS.perDay) return UI.toast(`Máximo ${LIMITS.perDay} ejercicios por día`);
    Picker.open(exId => {
      const ex = DB.ex(exId), plan = DB.newPlan(ex), it = { id: U.uid(), exerciseId: exId, plan, log: plan.map(() => DB.blank(ex)) };
      (Store.data.days[date] ||= []).push(it); Store.save();
      UI.close(); App.render(); ItemSheet.open({ kind: 'day', date, id: it.id });
    });
  },
  'item-open': el => ItemSheet.open({ kind: 'day', date: el.dataset.date, id: el.dataset.id }),
  row: el => {
    if (ItemSheet.ro()) return;
    const s = rowsFor(el)?.[+el.dataset.s]; if (!s) return;
    if (el.tagName === 'INPUT') { const c = el.dataset.k === 'r' ? U.cleanInt(el.value) : U.cleanDec(el.value); if (c !== el.value) el.value = c; }
    s[el.dataset.k] = el.dataset.k === 'r' ? (el.value === '' ? null : parseInt(el.value)) : U.num(el.value);
    Store.save();
  },
  crow: el => {
    if (ItemSheet.ro()) return;
    const s = rowsFor(el)?.[+el.dataset.s]; if (!s) return;
    if (el.tagName === 'INPUT') { const c = U.cleanInt(el.value); if (c !== el.value) el.value = c; }
    else el.className = el.value ? 'int' + el.value : '';
    s[el.dataset.k] = el.value === '' ? null : parseInt(el.value);
    Store.save();
  },
  ftog: el => {
    if (ItemSheet.ro()) return; const s = rowsFor(el)?.[+el.dataset.s]; if (!s) return;
    s.f = !s.f; if (!s.f) s.ds = false;
    if (s.f && el.dataset.t === 'plan') s.r = null;   // previsto al fallo: sin número
    Store.save(); ItemSheet.draw();
  },
  dstog: el => { if (ItemSheet.ro() || DB.isBW(DB.ex(rowItem(el)?.exerciseId))) return; const s = rowsFor(el)?.[+el.dataset.s]; if (!s || !s.f) return; s.ds = !s.ds; Store.save(); ItemSheet.draw(); },
  'row-add': el => {
    if (ItemSheet.ro()) return;
    const it = curItem(), targets = el.dataset.x === 'both' ? DB.mates(ItemSheet.list(), it) : [rowItem(el)];
    let any = false; for (const t of targets) any = addRow(t, el.dataset.t) || any;
    if (any) { Store.save(); ItemSheet.draw(); }
  },
  'row-del': el => {
    if (ItemSheet.ro()) return;
    const it = rowItem(el), rows = rowsFor(el); if (!it || !rows) return;
    if (rows.length <= 1) return UI.toast('Mínimo 1 serie');
    rows.splice(+el.dataset.s, 1);
    if (el.dataset.t === 'plan' && it.log && !DB.validSets(it.log).length && it.log.length > it.plan.length) it.log.length = it.plan.length;
    Store.save(); ItemSheet.draw();
  },
  'copy-plan': el => {
    if (ItemSheet.ro()) return;
    const it = curItem(), items = el?.dataset.x === 'both' ? DB.mates(ItemSheet.list(), it) : [it];
    if (items.some(x => DB.validSets(x.log).length) && !confirm('¿Sustituir lo realizado por lo previsto?')) return;
    for (const x of items) { const ex = DB.ex(x.exerciseId); x.log = x.plan.map(s => DB.copyRow(ex, s)); }
    Store.save(); ItemSheet.draw();
  },
  // biseries
  'ss-make': () => {
    if (ItemSheet.ro()) return;
    const it = curItem(), g = DB.mates(ItemSheet.list(), it);
    if (g.length >= DB.SS_MAX) return UI.toast(`Máximo ${DB.SS_MAX} ejercicios por serie compuesta`);
    const cands = ItemSheet.list().filter(x => !x.ss && x.id !== it.id && !DB.isCardio(DB.ex(x.exerciseId)));
    if (!cands.length) return UI.toast('Añade otro ejercicio de fuerza a este día para juntarlo');
    const last = g.length ? g[g.length - 1] : it;
    UI.open(`${UI.head(g.length ? 'Hacer triserie con…' : 'Hacer biserie con…', g.map(x => U.esc(DB.exName(x.exerciseId))).join(' + ') || U.esc(DB.exName(it.exerciseId)))}
      ${cands.map(c => `<div class="list-item clickable" data-act="ss-pick" data-id="${c.id}"><span class="dot" style="background:${DB.color(c.exerciseId)}"></span>
        <div class="grow bold">${U.esc(DB.exName(c.exerciseId))}</div><span style="color:var(--accent);font-weight:800">Unir</span></div>`).join('')}
      <div class="hint">El ejercicio elegido se colocará justo después de ${U.esc(DB.exName(last.exerciseId))}. Luego puedes cambiar el orden arrastrando ⠿.</div>`);
  },
  'ss-pick': el => {
    const list = ItemSheet.list(), it = curItem(), other = list.find(x => x.id === el.dataset.id); if (!it || !other) return;
    const g = DB.mates(list, it), last = g.length ? g[g.length - 1] : it, ss = it.ss || U.uid();
    if (g.length >= DB.SS_MAX) return;
    list.splice(list.indexOf(other), 1); list.splice(list.indexOf(last) + 1, 0, other);
    it.ss = other.ss = ss; DB.fixSS(list);
    Store.save(); UI.close(); ItemSheet.draw(); UI.toast(DB.ssName(DB.mates(list, it).length) + ' creada');
  },
  'ss-split': () => {
    if (ItemSheet.ro()) return;
    const g = DB.mates(ItemSheet.list(), curItem()); g.forEach(x => delete x.ss);
    Store.save(); ItemSheet.draw(); UI.toast(DB.ssName(g.length) + ' separada');
  },
  'ss-out': el => {   // saca un ejercicio del grupo (una triserie pasa a biserie; una biserie se separa)
    if (ItemSheet.ro()) return;
    const list = ItemSheet.list(), x = list.find(i => i.id === el.dataset.id), g = DB.mates(list, x); if (!x) return;
    const rest = g.filter(i => i !== x);
    delete x.ss; list.splice(list.indexOf(x), 1); list.splice(list.indexOf(rest[rest.length - 1]) + 1, 0, x);   // queda justo después del grupo
    DB.fixSS(list);
    if (ui.item.id === x.id && rest.length > 1) ui.item.id = rest[0].id;   // la ficha sigue mostrando el grupo
    Store.save(); ItemSheet.draw(); UI.toast(rest.length > 1 ? 'Ahora es una biserie' : 'Biserie separada');
  },
  'ss-del': () => {
    if (ItemSheet.ro()) return;
    const r = ui.item, g = DB.mates(ItemSheet.list(), curItem());

/* ===================== ASPECTO: color de acento, tamaño, foto ===================== */
const Look = {
  scale() { try { const v = parseFloat(localStorage.getItem(SCALE_KEY)); return SCALES.includes(v) ? v : 1; } catch { return 1; } },
  apply() {
    // tamaño: escala toda la interfaz
    document.documentElement.style.zoom = this.scale() === 1 ? '' : this.scale();
    // color de acento
    const a = ACCENTS.find(x => x.id === Store.data?.settings.accent) || ACCENTS[0];
    let st = $('#accent-style'); if (!st) { st = document.createElement('style'); st.id = 'accent-style'; document.head.appendChild(st); }
    const vars = c => `--accent:${c[0]};--accent-2:${c[1]};--accent-soft:${c[2]};--accent-text:${c[3]};--glow-1:${c[2]};`;
    st.textContent = a.id === 'rojo' ? '' : `:root{${vars(a.l)}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${vars(a.d)}}}:root[data-theme="dark"]{${vars(a.d)}}`;
    $('meta[name="theme-color"]')?.setAttribute('content', a.l[0]);
    requestAnimationFrame(() => Chart.redrawAll());
  },
  loadImage(file) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); img.naturalWidth ? res(img) : rej(new Error('img')); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  },
  profileError(e, fallback) {
    const m = (e?.message || String(e)).toLowerCase();
    if (m.includes('username taken') || m.includes('duplicate key') || e?.code === '23505') return 'Ese nombre de usuario ya está cogido.';
    if (m.includes('avatar') || m.includes('column') || m.includes('schema cache') || m.includes('permission denied')) return 'Falta ejecutar el SQL actualizado en Supabase.';
    if (m.includes('failed to fetch') || m.includes('network')) return 'No hay conexión con el servidor.';
    return fallback || 'Algo ha fallado: ' + (e?.message || e);
  }
};

/* Reordenar ejercicios de un día (o de un día de rutina prefabricada) arrastrando por el asa ⠿ */
const Reorder = {
  init() { document.addEventListener('pointerdown', e => { const g = e.target.closest('.grip'); if (g) this.start(e, g); }); },
  start(e, grip) {
    const item = grip.closest('.ss-who, .item, .ss-group'), box = item?.parentElement; if (!box) return;
    e.preventDefault(); e.stopPropagation();
    this.item = item; this.box = box; this.before = this.order(); this.pid = e.pointerId;
    item.classList.add('lifted'); document.body.classList.add('sorting');
    // se escucha en toda la ventana: al mover el ejercicio de sitio el asa se recoloca en la página
    const move = ev => { if (ev.pointerId === this.pid) { ev.preventDefault(); this.move(ev.clientY); } };
    const end = ev => {
      if (ev.pointerId !== this.pid) return;
      removeEventListener('pointermove', move); removeEventListener('pointerup', end); removeEventListener('pointercancel', end);
      this.end();
    };
    addEventListener('pointermove', move, { passive: false }); addEventListener('pointerup', end); addEventListener('pointercancel', end);
  },
  items() { return [...this.box.querySelectorAll(':scope > .item, :scope > .ss-group, :scope > .ss-who')]; },
  order() { return this.items().map(x => x.dataset.rid); },
  // el ejercicio cambia de hueco al pasar por la mitad del de al lado
  move(y) {
    for (const o of this.items()) {
      if (o === this.item) continue;
      const r = o.getBoundingClientRect(), mid = r.top + r.height / 2;
      const isAfter = !!(this.item.compareDocumentPosition(o) & Node.DOCUMENT_POSITION_FOLLOWING);
      if (isAfter && y > mid) { o.after(this.item); return; }
      if (!isAfter && y < mid) { o.before(this.item); return; }
    }
  },
  end() {
    this.item.classList.remove('lifted'); document.body.classList.remove('sorting');
    const ids = this.order(); if (ids.join() === this.before.join()) return;
    let list, sheet = false;
    const host = this.box.closest('[data-sort-date], [data-sort-tpl], [data-sort-ss]');
    if (host?.dataset.sortSs) { list = ItemSheet.list(); sheet = true; }
    else if (host?.dataset.sortDate) list = Store.data.days[host.dataset.sortDate];
    else if (host?.dataset.sortTpl != null) list = DB.tpl(ui.tplId)?.days[+host.dataset.sortTpl];
    if (!list) return;
    // ids en su nuevo orden (un grupo "ss:id" se expande a sus ejercicios); solo se recolocan esos, en los huecos que ocupaban
    const order = [];
    for (const id of ids) { if (id.startsWith('ss:')) list.filter(x => x.ss === id.slice(3)).forEach(x => order.push(x.id)); else order.push(id); }
    const items = order.map(id => list.find(x => x.id === id)).filter(Boolean);
    const slots = items.map(x => list.indexOf(x)).sort((a, b) => a - b);
    slots.forEach((k, n) => { list[k] = items[n]; });
    DB.fixSS(list);
    Store.save(); UI.toast('Orden actualizado');
    if (sheet) ItemSheet.draw(); else if (this.box.classList.contains('ss-body')) App.render();
  }
};

/* Calendario mensual de días en el gym (lunes a domingo, como el de cualquier móvil) */
const Cal = {
  open() { ui.calMonth = U.today().slice(0, 8) + '01'; UI.open('<div id="cal"></div>', () => this.draw()); },
  draw() {
    const box = $('#cal'); if (!box) return;
    const first = ui.calMonth, d0 = U.parse(first), month = d0.getMonth(), today = U.today();
    const last = U.iso(new Date(d0.getFullYear(), month + 1, 0));
    const states = {}; for (let m = U.monday(first); m <= last; m = U.addDays(m, 7)) Gym.week(m).forEach(x => { states[x.d] = x.s; });
    const SYM = { gym: '✓', miss: '✕', excused: 'J' };
    let cells = DAYS_S.map(d => `<div class="cal-dow">${d.slice(0, 2)}</div>`).join('');
    for (let d = U.monday(first); d <= last || U.dow(d) !== 0; d = U.addDays(d, 1)) {
      if (U.parse(d).getMonth() !== month) { cells += '<div class="cal-day out"></div>'; continue; }
      const st = states[d] || 'future';
      cells += `<button class="cal-day ${st} ${d === today ? 'today' : ''}" data-act="cal-day" data-date="${d}" title="${U.fmtLong(d)}">${U.parse(d).getDate()}${SYM[st] ? `<i>${SYM[st]}</i>` : ''}</button>`;
    }
    const thisMonth = first === today.slice(0, 8) + '01';
    box.innerHTML = `${UI.head('Días en el gym')}
      <div class="cal-head"><button class="btn sm ghost" data-act="cal-shift" data-n="-1" aria-label="Mes anterior">‹</button>
        <b>${MONTHS[month]} ${d0.getFullYear()}</b>
        <button class="btn sm ghost" data-act="cal-shift" data-n="1" aria-label="Mes siguiente">›</button></div>
      <div class="cal-grid">${cells}</div>
      ${thisMonth ? '' : '<button class="btn block mt2" data-act="cal-today">Volver a este mes</button>'}
      <div class="hint" style="text-align:center">Toca un día para verlo en Rutina.</div>`;
  }
};

/* Recortar la foto de perfil: arrastrar para colocarla y zoom con la barra, la rueda o pellizcando */
const Crop = {
  OUT: 192,   // tamaño final de la foto (px)
  open(img) {
    this.img = img; this.z = 1; this.x = 0; this.y = 0; this.pts = new Map();
    UI.open(`${UI.head('Coloca tu foto')}
      <div class="crop-box" id="crop-box"><canvas id="crop-cv"></canvas><div class="mask"></div></div>
      <div class="crop-zoom"><span class="muted">−</span><input type="range" id="crop-range" min="1" max="4" step="0.01" value="1" data-in="crop-zoom" aria-label="Zoom"><span class="muted">+</span></div>
      <div class="hint" style="text-align:center">Arrastra para moverla y usa la barra (o pellizca) para acercar.</div>
      <div class="row mt2"><button class="btn grow" data-act="modal-close">Cancelar</button><button class="btn primary grow" data-act="crop-save">Guardar</button></div>`, () => this.bind());
  },
  box() { return $('#crop-box'); },
  size() { return this.box()?.clientWidth || 280; },
  base(V) { return Math.max(V / this.img.naturalWidth, V / this.img.naturalHeight); },   // escala que cubre el círculo
  clamp() {
    const V = this.size(), s = this.base(V) * this.z, mx = Math.max(0, (this.img.naturalWidth * s - V) / 2), my = Math.max(0, (this.img.naturalHeight * s - V) / 2);
    this.x = Math.min(mx, Math.max(-mx, this.x)); this.y = Math.min(my, Math.max(-my, this.y));
  },
  paint(ctx, V) {
    const s = this.base(V) * this.z, w = this.img.naturalWidth * s, h = this.img.naturalHeight * s, k = V / this.size();
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, V, V);
    ctx.drawImage(this.img, V / 2 - w / 2 + this.x * k, V / 2 - h / 2 + this.y * k, w, h);
  },
  draw() {
    const cv = $('#crop-cv'); if (!cv) return;
    const V = this.size(), dpr = window.devicePixelRatio || 1;
    cv.width = cv.height = Math.round(V * dpr);
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); this.paint(ctx, V);
  },
  setZoom(z) { this.z = Math.min(4, Math.max(1, z)); const r = $('#crop-range'); if (r && +r.value !== this.z) r.value = this.z; this.clamp(); this.draw(); },
  bind() {
    const b = this.box(), zk = Look.scale(); this.draw();
    const dist = () => { const [a, c] = [...this.pts.values()]; return Math.hypot(a.x - c.x, a.y - c.y); };
    b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); this.pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (this.pts.size === 2) { this.d0 = dist(); this.z0 = this.z; } });
    b.addEventListener('pointermove', e => {
      const p = this.pts.get(e.pointerId); if (!p) return;
      if (this.pts.size === 1) { this.x += (e.clientX - p.x) / zk; this.y += (e.clientY - p.y) / zk; this.clamp(); this.draw(); }
      p.x = e.clientX; p.y = e.clientY;
      if (this.pts.size === 2 && this.d0) this.setZoom(this.z0 * dist() / this.d0);
    });
    const up = e => { this.pts.delete(e.pointerId); if (this.pts.size < 2) this.d0 = null; };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
    b.addEventListener('wheel', e => { e.preventDefault(); this.setZoom(this.z * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); }, { passive: false });
  },
  async save(img) {
    const square = !!img; if (img) { this.img = img; this.z = 1; this.x = 0; this.y = 0; }
    const cv = document.createElement('canvas'); cv.width = cv.height = this.OUT;
    if (square) cv.getContext('2d').drawImage(this.img, 0, 0, this.OUT, this.OUT);
    else { const V = this.size(), ctx = cv.getContext('2d'); ctx.scale(this.OUT / V, this.OUT / V); this.paint(ctx, V); }
    const url = cv.toDataURL('image/jpeg', 0.85);
    try {
      await Cloud.updateProfile({ avatar: url });
      if (!square) UI.close();
      App.render(); UI.toast('Foto actualizada');
    } catch (e) { UI.toast(Look.profileError(e)); }
  }
};

/* Exportar todos los datos a CSV (se abre en Excel). Una fila por serie; separador ";" y UTF-8 con BOM. */
const Export = {
  cell(v) {
    if (v == null) return '';
    let s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  },
  rows() {
    const d = Store.data, out = [['Fecha', 'Día', 'Ejercicio', 'Grupo', 'Músculo', 'Tipo de carga', 'Previsto/Realizado', 'Serie', 'Peso', 'Reps', 'Fallo', 'Drop set', 'Minutos', 'Intensidad', 'Estado', 'Biserie/Triserie', 'Nota del día']];
    const dates = [...new Set([...Object.keys(d.days || {}), ...Object.keys(d.notes || {})])].sort();
    for (const date of dates) {
      const items = d.days[date] || [], n = d.notes?.[date], dia = DAYS[U.dow(date)];
      const note = n ? [n.r ? n.r + '/5' : '', n.t || ''].filter(Boolean).join(' · ') : '';
      if (!items.length) { out.push([date, dia, '', '', '', '', '', '', '', '', '', '', '', '', '', '', note]); continue; }
      for (const it of items) {
        const ex = DB.ex(it.exerciseId), g = ex ? DB.group(ex.group).name : '', st = DB.status(it), mates = DB.mates(items, it).filter(x => x !== it);
        const base = [date, dia, DB.exName(it.exerciseId), g, ex?.muscle || '', LOADS[ex?.load || 'kg']?.name || ''];
        const estado = st === '-' ? '−' : st || '', bis = mates.length ? DB.ssName(mates.length + 1) + ' con ' + mates.map(x => DB.exName(x.exerciseId)).join(' y ') : '';
        for (const [k, label] of [['plan', 'Previsto'], ['log', 'Realizado']]) (it[k] || []).forEach((s, i) => {
          if (k === 'log' && !DB.done(s)) return;   // series realizadas vacías no se exportan
          const cardio = DB.isCardio(ex), noW = cardio || DB.isBW(ex);
          out.push([...base, label, i + 1, noW ? '' : s.w, cardio ? '' : s.r, !cardio && s.f ? 'Sí' : '', !cardio && s.ds ? 'Sí' : '',
            cardio ? s.m : '', cardio && s.i ? INTENSITY[s.i - 1] : '', estado, bis, note]);
        });
      }
    }
    return out;
  },
  async csv() {
    const text = '\ufeff' + this.rows().map(r => r.map(c => this.cell(c)).join(';')).join('\r\n');
    const name = `gymtrack-${Cloud.profile?.username || 'datos'}-${U.today()}.csv`;
    const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
    // en el móvil se abre el menú de compartir (guardar en Archivos, enviar…); en el ordenador se descarga
    try {
      const file = new File([blob], name, { type: 'text/csv' });
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: 'GymTrack' }); return; }
    } catch (e) { if (e?.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    UI.toast('Datos exportados');
  }
};

/* ===================== AVISO DE VERSIÓN NUEVA =====================
   Compara APP_VERSION con version.json (que se publica junto a la app). Al subir una versión nueva
   hay que actualizar los tres: APP_VERSION aquí, version.json y VERSION en sw.js.                  */
const Updater = {
  reg: null,
  newer(a, b) { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; },
  async check() {
    if (!/^https?:$/.test(location.protocol)) return;
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
      const { version } = await r.json();
      if (version && this.newer(version, APP_VERSION)) this.show(version);
    } catch { /* sin conexión */ }
  },
  show(v) {
    if ($('#update-bar')) return;
    const b = document.createElement('div'); b.id = 'update-bar'; b.className = 'update-bar';
    b.innerHTML = `<span>Hay una versión nueva <b>v${U.esc(v)}</b></span><button class="btn sm primary" data-act="app-update">Actualizar</button><button class="icon-btn" data-act="update-later" aria-label="Más tarde">✕</button>`;
    document.body.appendChild(b);
  },
  async apply() {
    const b = $('#update-bar'); if (b) b.querySelector('.btn').textContent = 'Actualizando…';
    try { await Cloud.flush(); } catch {}
    try { await this.reg?.update(); } catch {}
    location.reload();
  }
};

const App = {
  render() {

  },
  go(t) { ui.tab = t; ui.stripX = null; try { sessionStorage.setItem('gymtrack.tab', t); } catch {} window.scrollTo(0, 0); this.render(); },
  applyTheme() {
    const t = Store.data?.settings.theme || 'auto', r = document.documentElement;
    if (t === 'auto') r.removeAttribute('data-theme'); else r.dataset.theme = t;
    Look.apply();
  },
  // datos guardados en este dispositivo antes de que existieran las cuentas
  legacyData() {
    try { const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return null; const d = JSON.parse(raw); return d.exercises?.length || Object.keys(d.days || {}).length ? d : null; } catch { return null; }
  },
  // entrar con un usuario: carga su perfil y sus datos (o los crea si la cuenta es nueva)
  async enter(user) {
    Cloud.user = user; Cloud.dirty = false; Cloud.lastRemote = null; Store.use(user.id);
    let profile = null, remote = null, offline = false;
    try { [profile, remote] = await Promise.all([Cloud.fetchProfile(), Cloud.fetchData()]); } catch { offline = true; }
    Cloud.profile = profile || Cloud.cachedProfile() || { username: user.user_metadata?.username || '', email: user.email, created_at: user.created_at };
    const pending = Cloud.pending(), cache = Store.cached();
    if (remote) {
      let d = Migrations.run(remote.data);
      // cambios hechos en este dispositivo que no llegaron a subirse: se fusionan con la nube, no se pierden
      if (pending && cache) d = Sync.merge(Migrations.run(cache), d).data;
      Store.set(d); Cloud.lastRemote = remote.updated_at; Store.save(false);
      if (pending) { Cloud.dirty = true; Cloud.setStatus('saving'); setTimeout(() => Cloud.flush(), 0); } else Cloud.setStatus('saved');
    } else if (offline) {
      if (!cache) { Cloud.user = null; return Auth.show('login', { err: 'No hay conexión con el servidor. Inténtalo de nuevo en un momento.' }); }
      Store.set(Migrations.run(cache)); Cloud.dirty = pending; Cloud.setStatus('offline');
      setTimeout(() => UI.toast('Sin conexión: puedes seguir apuntando, se subirá al volver'), 300);
    } else {
      // cuenta nueva: fecha de alta y días por semana elegidos en el registro
      const created = U.iso(new Date(Cloud.profile.created_at || Date.now())), goal = Math.min(7, Math.max(1, +user.user_metadata?.goal || DEFAULT_GOAL));
      let d = defaultData();
      const legacy = this.legacyData();
      if (legacy && confirm('Este dispositivo tiene datos de GymTrack de antes de las cuentas (ejercicios, entrenos, rutinas…). ¿Quieres pasarlos a tu cuenta?')) {
        d = Migrations.run(legacy);
        try { localStorage.setItem(STORAGE_KEY + '.importado', localStorage.getItem(STORAGE_KEY)); localStorage.removeItem(STORAGE_KEY); } catch {}
      }
      d.account = { createdAt: created, goals: [{ from: U.monday(created), n: goal }] };
      Store.set(d); Store.save(); await Cloud.flush();
    }
    document.body.classList.remove('auth');
    try { const t = sessionStorage.getItem('gymtrack.tab'); ui.tab = t && Views[t] ? t : 'rutina'; } catch { ui.tab = 'rutina'; }
    ui.weekOff = 0; ui.stripX = null;
    this.applyTheme(); this.render();
    Updater.check();
  },
  async logout() {
    if (Cloud.dirty || Cloud.saving) await Cloud.flush();
    if (Cloud.dirty && !confirm('Hay cambios que aún no se han subido (sin conexión). En este dispositivo no se pierden, pero no estarán en otros hasta que vuelvas a entrar aquí. ¿Cerrar sesión igualmente?')) return;
    if (!Cloud.dirty && !confirm('¿Cerrar sesión?')) return;
    clearTimeout(Cloud.timer);
    const sb = Cloud.sb; Cloud.user = null; Cloud.profile = null; Store.data = null;
    await sb.auth.signOut();
    this.applyTheme(); Auth.show();
  },
  setup(msg) {
    document.body.classList.add('auth');
    $('#view').innerHTML = `<div class="auth-wrap setup"><div class="auth-hero"><div class="brand">Gym<span>Track</span></div></div>
      <div class="card">${msg || `<h3>Falta conectar el servidor</h3>
        <ol><li>Crea un proyecto en <b>supabase.com</b>.</li><li>En <b>SQL Editor</b>, ejecuta el archivo <code>supabase.sql</code>.</li>
        <li>En <b>Project Settings → API</b>, copia la <i>Project URL</i> y la clave <i>anon public</i>.</li>
        <li>Pégalas en <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code>, al principio del script de este archivo.</li></ol>`}</div></div>`;
  },
  async init() {
    // modo sin conexión: el service worker guarda la app en el dispositivo (solo funciona desde la web, no abriendo el archivo)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').then(r => { Updater.reg = r; }).catch(() => {});
    document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); H['form-' + f.dataset.form]?.(f); });
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
      const f = H[el.dataset.act]; if (f) { e.preventDefault(); e.stopPropagation(); f(el, e); }
    });
    document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el) H[el.dataset.in]?.(el, e); });
    document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el) H[el.dataset.ch]?.(el, e); });
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => Chart.redrawAll(), 150); });
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => Chart.redrawAll());
    document.fonts?.ready.then(() => Chart.redrawAll());
    this.applyTheme(); Reorder.init();
    if (!Cloud.configured()) return this.setup();
    try { Cloud.init(); } catch { return this.setup('<h3>No se pudo cargar el servidor</h3><p class="muted">Revisa tu conexión a internet y recarga la página.</p>'); }
    Cloud.sb.auth.onAuthStateChange(ev => {
      if (ev === 'PASSWORD_RECOVERY') { Auth.recovering = true; Auth.show('recover'); }
      if (ev === 'SIGNED_OUT' && Cloud.user) { Cloud.user = null; Store.data = null; Auth.show(); }   // sesión caducada o cerrada en otro sitio
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Cloud.refresh(); Updater.check(); } else Cloud.flush(); });
    setInterval(() => { if (document.visibilityState === 'visible') Cloud.refresh(); }, 60000);          // cambios de otros dispositivos
    setInterval(() => { if (document.visibilityState === 'visible') Updater.check(); }, 30 * 60000);    // versión nueva publicada
    addEventListener('online', () => { if (Cloud.user) { Cloud.setStatus('saving'); Cloud.refresh(); } });
    addEventListener('offline', () => Cloud.setStatus('offline'));
    addEventListener('pagehide', () => Cloud.flush());
    let session = null;
    try { session = (await Cloud.sb.auth.getSession()).data.session; } catch {}
    if (Auth.recovering || /type=recovery/.test(location.hash)) { Auth.recovering = true; return Auth.show('recover'); }
    if (session?.user) await this.enter(session.user); else Auth.show();
    if (location.hash.includes('access_token') || location.hash.includes('error')) history.replaceState(null, '', Auth.home());   // limpia la URL tras confirmar el correo
  }
};
App.init();
</script>
</body>
</html>
